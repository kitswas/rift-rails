<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Rift Rails: The Infinite Express</title>
  </head>
  <body>
    <!--
    ========================================================
    DEVELOPER NOTES: THE ENERGY & SECTOR ECONOMY
    *** DO NOT REMOVE THIS COMMENT BLOCK ***
    ========================================================
    1. ENGINE TIER = MAX ENERGY & TRAVEL COST
       - A larger engine increases the max Energy capacity of the train,
         allowing for more explorations and actions per dimension.
       - However, a heavier engine increases the Fuel cost to initiate a Rift Jump.
       - Anti-Trap Transparency: Human players exhibit bounded rationality and
         calculate within a short forward horizon. Upgrade buttons must explicitly
         disclose the increased jump cost and warn if current fuel cannot support it.
       - Energy resets completely upon entering a new dimension.

    2. INFINITE PLAYABILITY BALANCE & CADENCE
       - All numerical values and strings are stored in a central GAME_DATA object.
       - Onboarding Runway: An initial fixed sequence safely introduces mining,
         harvesting, combat, and upgrading without opening RNG death spirals.
       - Sector Cadence: Hubs are fixed at recurring waypoints to provide reliable
         tension-relief harbors. Deep-void nodes between Hubs are drawn from a
         balanced bag shuffle to eliminate dry streaks.

    3. ENGAGING GAMEPLAY & BOUNDED RATIONALITY
       - Designed for human decision horizons (immediate 1-3 step lookahead)
         rather than predictive machine optimizers.

    4. CODE QUALITY RULES
       - Preserve comments. Comments explain why, not what.
       - Single source of truth. DRY.
       - No magic literals. Constant names explain purpose.
       - Literals only belong in assignment statements.

    5. PROGRAM CORRECTNESS
       - State mutations strictly flow through Engine.transitionTo().
       - verifyGraphIntegrity(): Runs on boot. Ensures GAME_DATA.transitions
         has no deadlocks or orphaned states (crucial when AI hallucinates edits).
       - verifyPaletteIntegrity(): Ensure log colour types remain visually distinct.
       - assertInvariants(): Runs after every UI update. Verifies mathematically
         impossible states (e.g., negative energy) hasn't occurred.
    ========================================================
    -->
    <div id="app">
      <div id="start-screen">
        <h1>Rift Rails</h1>
        <button id="btn-ignite" type="button">Ignite</button>
        <button id="btn-start-fresh" type="button">New Journey</button>
      </div>
      <div id="game-container" style="display: none">
        <header id="hud-bar">
          <span id="location-name"></span>
          <span id="location-type"></span>
          <span id="stat-hull"></span>
          <span id="stat-fuel"></span>
          <span id="stat-energy"></span>
          <span id="stat-flux"></span>
          <span id="stat-rep"></span>
          <span id="stat-sector"></span>
        </header>
        <div id="right-panel">
          <div id="snap-slider">
            <section id="pane-settings">
              <select id="select-ambient-mode"></select>
              <input id="slider-ambient-vol" type="range" />
              <span id="lbl-ambient-vol"></span>
              <input id="slider-sfx-vol" type="range" />
              <span id="lbl-sfx-vol"></span>
              <button id="btn-toggle-mute" type="button"></button>
              <button id="btn-reset-save" type="button"></button>
            </section>
            <section id="pane-sensors">
              <div id="art-display">
                <div id="art-glyph"></div>
                <span id="art-label"></span>
              </div>
            </section>
            <section id="pane-bridge">
              <div id="bridge-scene"></div>
            </section>
            <section id="pane-forge">
              <span id="lbl-forge"></span>
              <button id="btn-forge-engine" type="button"></button>
              <button id="btn-forge-weapon" type="button"></button>
              <span id="equip-engine"></span>
              <span id="equip-weapon"></span>
              <span id="equip-module"></span>
              <span id="equip-carriage"></span>
              <span id="equip-crew"></span>
            </section>
            <section id="pane-manual">
              <div id="dim-type-codex"></div>
            </section>
          </div>
          <div id="action-buttons">
            <button id="btn-explore" type="button"></button>
            <button id="btn-travel" type="button"></button>
            <button id="btn-desperate" type="button"></button>
          </div>
          <div id="story-log"></div>
          <div id="encounter-choices"></div>
        </div>
        <nav id="bottom-nav">
          <button id="tab-settings" type="button"></button>
          <button id="tab-sensors" type="button"></button>
          <button id="tab-bridge" type="button"></button>
          <button id="tab-forge" type="button"></button>
          <button id="tab-manual" type="button"></button>
        </nav>
        <div id="corvus-portrait">
          <div id="robe"></div>
          <div id="eye-sockets">
            <div id="eye-glow-left"></div>
            <div id="eye-glow-right"></div>
          </div>
          <div id="beak"></div>
          <div id="mask"></div>
          <div id="sparkle"></div>
          <div id="veil"></div>
        </div>
        <div id="nav-screen">
          <h2 id="lbl-nav-title"></h2>
          <div id="nav-choices"></div>
          <div id="nav-vector">
            <svg id="rift-vector-scale">
              <g id="rift-vector-mesh"></g>
              <g id="rift-vector-needle"></g>
            </svg>
            <span id="vector-slot-0"></span>
            <span id="vector-slot-1"></span>
            <span id="vector-slot-solo"></span>
            <span id="nav-vector-status"></span>
          </div>
        </div>
        <div id="tutorial-cue"></div>
        <div id="cutscene-overlay">
          <div id="cutscene-speaker"></div>
          <div id="cutscene-body"></div>
          <div id="cutscene-progress"></div>
          <div id="cutscene-choices"></div>
          <button id="cutscene-btn-a" type="button"></button>
          <button id="cutscene-btn-b" type="button"></button>
        </div>
        <canvas id="fx-canvas"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
