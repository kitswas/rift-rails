<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>5-Tone Vector Diorama & Pixel Engine</title>
    <style>
      :root {
        --bg-dark: #0b0b10;
        --panel-dark: #14141d;
        --border-dark: #262638;
        --amber-glow: #ffb800;
        --amber-dim: #8a6500;
        --text-main: #d0d0e0;
        --font-mono: "Courier New", Courier, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-mono);
        text-transform: uppercase;
        letter-spacing: 1px;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* Terminal Header */
      header {
        background: var(--panel-dark);
        border-bottom: 2px solid var(--border-dark);
        padding: 10px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        font-size: 1.1rem;
        font-weight: bold;
        color: var(--amber-glow);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-badge {
        background: var(--amber-glow);
        color: #000;
        padding: 2px 6px;
        font-size: 0.75rem;
        font-weight: 900;
        border-radius: 2px;
      }

      .nav-tabs {
        display: flex;
        gap: 8px;
      }

      .tab-btn {
        background: #1c1c28;
        border: 1px solid var(--border-dark);
        color: var(--text-main);
        padding: 6px 16px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tab-btn:hover {
        border-color: var(--amber-glow);
        color: var(--amber-glow);
      }

      .tab-btn.active {
        background: var(--amber-glow);
        color: #000;
        border-color: var(--amber-glow);
        font-weight: bold;
      }

      /* Main Container Layout */
      .main-container {
        display: grid;
        grid-template-columns: 320px 1fr;
        flex: 1;
        overflow: hidden;
      }

      /* Sidebar Controls Panel */
      .sidebar {
        background: var(--panel-dark);
        border-right: 2px solid var(--border-dark);
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
      }

      .section-title {
        font-size: 0.8rem;
        color: var(--amber-glow);
        border-bottom: 1px solid var(--border-dark);
        padding-bottom: 4px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.75rem;
        color: #8888a0;
      }

      select,
      button {
        background: #0e0e14;
        border: 1px solid var(--border-dark);
        color: var(--text-main);
        padding: 8px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        cursor: pointer;
        outline: none;
      }

      select:focus,
      button:focus {
        border-color: var(--amber-glow);
      }

      .palette-swatches {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 24px;
        border: 1px solid var(--border-dark);
        margin-top: 4px;
      }

      .swatch {
        height: 100%;
      }

      .layer-toggles {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.75rem;
        cursor: pointer;
        color: var(--text-main);
      }

      .checkbox-label input {
        accent-color: var(--amber-glow);
      }

      .hud-badges {
        display: flex;
        gap: 6px;
        margin-top: auto;
      }

      .badge {
        flex: 1;
        background: #0e0e14;
        border: 1px solid var(--border-dark);
        text-align: center;
        padding: 6px 0;
        font-size: 0.7rem;
        color: var(--amber-dim);
      }

      .badge.active {
        border-color: var(--amber-glow);
        color: var(--amber-glow);
        box-shadow: 0 0 6px rgba(255, 184, 0, 0.2);
      }

      /* Viewport Display Area */
      .viewport {
        position: relative;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
      }

      .canvas-container {
        position: relative;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        border: 2px solid var(--border-dark);
      }

      canvas {
        display: block;
        image-rendering: pixelated;
      }

      .ui-overlay {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        pointer-events: none;
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--amber-glow);
        text-shadow: 0 0 4px #000;
      }

      .game-controls-hint {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(14, 14, 20, 0.85);
        border: 1px solid var(--border-dark);
        padding: 6px 12px;
        font-size: 0.7rem;
        color: var(--amber-glow);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-badge">5T-ENGINE</span>
        <span>DIORAMA &amp; DITHER SYSTEM</span>
      </div>
      <div class="nav-tabs">
        <button
          class="tab-btn active"
          id="btn-browser"
          onclick="switchTab('browser')"
        >
          ARTWORK BROWSER
        </button>
        <button class="tab-btn" id="btn-game" onclick="switchTab('game')">
          GAME ENGINE
        </button>
      </div>
    </header>

    <div class="main-container">
      <!-- Sidebar Controls -->
      <div class="sidebar">
        <div class="control-group">
          <div class="section-title"><span>01 // PALETTE MATRIX</span></div>
          <label for="palette-select">COLOR PALETTE PRESET</label>
          <select id="palette-select" onchange="updatePalette(this.value)">
            <option value="crimson">CRIMSON VOID</option>
            <option value="neon">NEON VIOLET</option>
            <option value="clockwork">CLOCKWORK BRASS</option>
            <option value="frozen">FROZEN GLACIER</option>
            <option value="overgrown">OVERGROWN RUIN</option>
          </select>
          <div class="palette-swatches" id="swatch-container">
            <!-- Populated dynamically -->
          </div>
        </div>

        <div class="control-group">
          <div class="section-title"><span>02 // PIPELINE</span></div>
          <label for="render-mode">PIPELINE STYLE</label>
          <select id="render-mode" onchange="updateRenderMode(this.value)">
            <option value="vector">VECTOR DIORAMA (5-TONE)</option>
            <option value="pixel">8-BIT BAYER DITHER (LOW-RES)</option>
          </select>
        </div>

        <div class="control-group">
          <div class="section-title"><span>03 // DEPTH LAYERS</span></div>
          <div class="layer-toggles">
            <label class="checkbox-label"
              ><input
                type="checkbox"
                id="layer-0"
                checked
                onchange="toggleLayer(0)"
              />
              L0: SKY &amp; CELESTIAL</label
            >
            <label class="checkbox-label"
              ><input
                type="checkbox"
                id="layer-1"
                checked
                onchange="toggleLayer(1)"
              />
              L1: FAR BACKGROUND RIDGES</label
            >
            <label class="checkbox-label"
              ><input
                type="checkbox"
                id="layer-2"
                checked
                onchange="toggleLayer(2)"
              />
              L2: MIDGROUND FACETS</label
            >
            <label class="checkbox-label"
              ><input
                type="checkbox"
                id="layer-3"
                checked
                onchange="toggleLayer(3)"
              />
              L3: FOREGROUND ARCHITECTURE</label
            >
            <label class="checkbox-label"
              ><input
                type="checkbox"
                id="layer-4"
                checked
                onchange="toggleLayer(4)"
              />
              L4: VIGNETTE FRAMING</label
            >
          </div>
        </div>

        <div class="control-group">
          <div class="section-title"><span>04 // SHADER POST-FX</span></div>
          <label for="fx-select">POST-PROCESSING FILTER</label>
          <select id="fx-select" onchange="updateFX(this.value)">
            <option value="none">NONE (CLEAN)</option>
            <option value="glitch">FRACTURED / GLITCH SHIFT</option>
            <option value="rays">VOLUMETRIC GOD RAYS</option>
            <option value="shimmer">WATER SHIMMER / CAUSTICS</option>
            <option value="eldritch">ELDRITCH WARP WAVE</option>
          </select>
        </div>

        <div class="hud-badges">
          <div class="badge active" id="badge-hub">HUB</div>
          <div class="badge" id="badge-hunt">HUNT</div>
          <div class="badge" id="badge-res">RES</div>
          <div class="badge" id="badge-maze">MAZE</div>
        </div>
      </div>

      <!-- Viewport Display -->
      <div class="viewport">
        <div class="canvas-container">
          <canvas id="viewCanvas" width="800" height="450"></canvas>
          <div class="ui-overlay" id="ui-overlay">
            <div id="status-left">MODE: ARTWORK BROWSER</div>
            <div id="status-right">FPS: 60</div>
          </div>
          <div class="game-controls-hint" id="game-hint" style="display: none">
            CONTROLS: [A/D] or [LEFT/RIGHT] MOVE | [SPACE] or [W] JUMP
          </div>
        </div>
      </div>
    </div>

    <script>
      // --- COLOR PALETTE DEFINITIONS (5-TONE HIERARCHY) ---
      const PALETTES = {
        crimson: ["#120407", "#4a0e17", "#9b111e", "#e32649", "#ff6f41"],
        neon: ["#0a0317", "#210b3e", "#7a1262", "#f6338d", "#04deea"],
        clockwork: ["#120d04", "#3d260c", "#855213", "#de9314", "#fdc63c"],
        frozen: ["#030c14", "#0a2540", "#145374", "#38acd8", "#b9ddfe"],
        overgrown: ["#031109", "#08422d", "#1b7a43", "#3eb46a", "#85d964"],
      };

      // --- BAYER 4x4 DITHER MATRIX ---
      const BAYER_4X4 = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ];

      // --- ENGINE STATE ---
      let state = {
        tab: "browser", // 'browser' | 'game'
        paletteKey: "crimson",
        palette: PALETTES.crimson,
        renderMode: "vector", // 'vector' | 'pixel'
        layers: [true, true, true, true, true],
        fx: "none",
        time: 0,
        mouseX: 0,
        mouseY: 0,
      };

      // --- GAME STATE ---
      let game = {
        player: { x: 100, y: 320, vx: 0, vy: 0, radius: 12, grounded: false },
        orbs: [],
        score: 0,
        cameraX: 0,
      };

      const keys = {};

      // --- CANVAS & CONTEXT SETUP ---
      const canvas = document.getElementById("viewCanvas");
      const ctx = canvas.getContext("2d");

      // Offscreen canvas for low-res pixel mode
      const lowResCanvas = document.createElement("canvas");
      lowResCanvas.width = 200;
      lowResCanvas.height = 1125; // 200x112 scaled
      lowResCanvas.height = 112;
      const lowResCtx = lowResCanvas.getContext("2d");

      // --- INITIALIZATION ---
      function init() {
        updateSwatchUI();
        initGameOrbs();

        // Event Listeners
        window.addEventListener("keydown", (e) => (keys[e.code] = true));
        window.addEventListener("keyup", (e) => (keys[e.code] = false));

        canvas.addEventListener("mousemove", (e) => {
          const rect = canvas.getBoundingClientRect();
          state.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
          state.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        requestAnimationFrame(engineLoop);
      }

      function initGameOrbs() {
        game.orbs = [];
        for (let i = 0; i < 15; i++) {
          game.orbs.push({
            x: 300 + i * 180 + Math.random() * 50,
            y: 220 - Math.random() * 80,
            collected: false,
          });
        }
      }

      // --- UI UPDATERS ---
      function switchTab(tabName) {
        state.tab = tabName;
        document
          .getElementById("btn-browser")
          .classList.toggle("active", tabName === "browser");
        document
          .getElementById("btn-game")
          .classList.toggle("active", tabName === "game");
        document.getElementById("game-hint").style.display =
          tabName === "game" ? "block" : "none";
        document.getElementById("status-left").innerText =
          `MODE: ${tabName.toUpperCase()} ENGINE`;

        document
          .getElementById("badge-hub")
          .classList.toggle("active", tabName === "browser");
        document
          .getElementById("badge-hunt")
          .classList.toggle("active", tabName === "game");

        if (tabName === "game") {
          game.player.x = 100;
          game.player.y = 320;
          game.score = 0;
          initGameOrbs();
        }
      }

      function updatePalette(val) {
        state.paletteKey = val;
        state.palette = PALETTES[val];
        updateSwatchUI();
      }

      function updateSwatchUI() {
        const container = document.getElementById("swatch-container");
        container.innerHTML = "";
        state.palette.forEach((color, i) => {
          const div = document.createElement("div");
          div.className = "swatch";
          div.style.backgroundColor = color;
          div.title = `Tone ${i}: ${color}`;
          container.appendChild(div);
        });
      }

      function updateRenderMode(val) {
        state.renderMode = val;
      }
      function toggleLayer(idx) {
        state.layers[idx] = document.getElementById(`layer-${idx}`).checked;
      }
      function updateFX(val) {
        state.fx = val;
      }

      // --- MAIN ENGINE LOOP ---
      let lastTime = performance.now();
      let frameCount = 0;
      let fps = 60;

      function engineLoop(now) {
        state.time += 0.03;
        frameCount++;
        if (now - lastTime >= 1000) {
          fps = frameCount;
          frameCount = 0;
          lastTime = now;
          document.getElementById("status-right").innerText =
            `FPS: ${fps} | ORBS: ${game.score}`;
        }

        if (state.tab === "game") {
          updateGameLogic();
        }

        // Render Scene
        if (state.renderMode === "vector") {
          renderVectorScene(ctx, canvas.width, canvas.height);
        } else {
          renderPixelDitherScene();
        }

        // Post-Processing FX
        applyPostFX(ctx, canvas.width, canvas.height);

        requestAnimationFrame(engineLoop);
      }

      // --- GAME LOGIC ---
      function updateGameLogic() {
        const p = game.player;

        // Controls
        if (keys["KeyA"] || keys["ArrowLeft"]) p.vx -= 0.8;
        if (keys["KeyD"] || keys["ArrowRight"]) p.vx += 0.8;
        if ((keys["Space"] || keys["KeyW"] || keys["ArrowUp"]) && p.grounded) {
          p.vy = -11;
          p.grounded = false;
        }

        // Physics
        p.vx *= 0.85;
        p.vy += 0.5; // Gravity
        p.x += p.vx;
        p.y += p.vy;

        // Ground Collision (Foreground Platform Level)
        const floorY = 340;
        if (p.y + p.radius > floorY) {
          p.y = floorY - p.radius;
          p.vy = 0;
          p.grounded = true;
        }

        // Camera Tracking
        game.cameraX += (p.x - game.cameraX - 200) * 0.1;

        // Collectibles Collision
        game.orbs.forEach((orb) => {
          if (!orb.collected) {
            const dx = p.x - orb.x;
            const dy = p.y - orb.y;
            if (Math.sqrt(dx * dx + dy * dy) < p.radius + 10) {
              orb.collected = true;
              game.score += 100;
            }
          }
        });
      }

      // --- VECTOR DIORAMA RENDERING PIPELINE ---
      function renderVectorScene(targetCtx, w, h) {
        const p = state.palette;
        const camX = state.tab === "game" ? game.cameraX : state.mouseX * 0.2;

        targetCtx.clearRect(0, 0, w, h);

        // --- LAYER 0: SKY / BACKDROP ---
        if (state.layers[0]) {
          const skyGrad = targetCtx.createLinearGradient(0, 0, 0, h);
          skyGrad.addColorStop(0, p[0]);
          skyGrad.addColorStop(1, p[1]);
          targetCtx.fillStyle = skyGrad;
          targetCtx.fillRect(0, 0, w, h);

          // Celestial Body (Sun/Moon Glow)
          targetCtx.save();
          targetCtx.fillStyle = p[4];
          targetCtx.shadowColor = p[3];
          targetCtx.shadowBlur = 25;
          targetCtx.beginPath();
          targetCtx.arc(w * 0.75 - ((camX * 0.05) % w), 90, 40, 0, Math.PI * 2);
          targetCtx.fill();
          targetCtx.restore();
        }

        // --- LAYER 1: FAR BACKGROUND RIDGES ---
        if (state.layers[1]) {
          targetCtx.fillStyle = p[1];
          targetCtx.beginPath();
          targetCtx.moveTo(0, h);
          for (let x = 0; x <= w; x += 40) {
            let rx = x + camX * 0.1;
            let y =
              h - 160 - Math.sin(rx * 0.01) * 50 - Math.cos(rx * 0.025) * 30;
            targetCtx.lineTo(x, y);
          }
          targetCtx.lineTo(w, h);
          targetCtx.fill();
        }

        // --- LAYER 2: MIDGROUND FACETED MOUNTAINS & TREES ---
        if (state.layers[2]) {
          targetCtx.save();
          targetCtx.shadowColor = "rgba(0,0,0,0.4)";
          targetCtx.shadowOffsetY = 8;

          // Draw Faceted Conical Trees & Peaks
          const startX = -((camX * 0.3) % 100);
          for (let x = startX - 100; x < w + 100; x += 70) {
            const treeH = 140 + Math.sin(x) * 30;
            const baseY = h - 90;

            // Split Face Left (Tone 1)
            targetCtx.fillStyle = p[1];
            targetCtx.beginPath();
            targetCtx.moveTo(x, baseY - treeH);
            targetCtx.lineTo(x - 35, baseY);
            targetCtx.lineTo(x, baseY);
            targetCtx.fill();

            // Split Face Right (Tone 2)
            targetCtx.fillStyle = p[2];
            targetCtx.beginPath();
            targetCtx.moveTo(x, baseY - treeH);
            targetCtx.lineTo(x, baseY);
            targetCtx.lineTo(x + 35, baseY);
            targetCtx.fill();
          }
          targetCtx.restore();
        }

        // --- LAYER 3: FOREGROUND ARCHITECTURE & GAME LEVEL ---
        if (state.layers[3]) {
          targetCtx.save();
          targetCtx.shadowColor = "#000";
          targetCtx.shadowBlur = 12;

          // Ground Structure
          const offset3 = camX * 0.8;
          targetCtx.fillStyle = p[2];
          targetCtx.fillRect(0, h - 110, w, 110);

          // Structural Facets & Pillars
          for (let x = -(offset3 % 160); x < w + 160; x += 160) {
            // Pillar Light Side (Tone 3)
            targetCtx.fillStyle = p[3];
            targetCtx.fillRect(x, h - 220, 20, 110);
            // Pillar Shadow Side (Tone 2)
            targetCtx.fillStyle = p[2];
            targetCtx.fillRect(x + 20, h - 220, 20, 110);

            // Top Archway Trim (Tone 4 Glow)
            targetCtx.fillStyle = p[4];
            targetCtx.fillRect(x - 10, h - 225, 60, 5);
          }

          // Draw Game Collectibles if in Game mode or Preview Mode
          const renderOrbs =
            state.tab === "game"
              ? game.orbs
              : [
                  { x: 200, y: 220, collected: false },
                  { x: 400, y: 200, collected: false },
                  { x: 600, y: 230, collected: false },
                ];

          renderOrbs.forEach((orb) => {
            if (!orb.collected) {
              const screenX =
                state.tab === "game" ? orb.x - game.cameraX : orb.x;
              if (screenX > -20 && screenX < w + 20) {
                targetCtx.fillStyle = p[4];
                targetCtx.shadowColor = p[4];
                targetCtx.shadowBlur = 15;
                targetCtx.beginPath();
                targetCtx.arc(
                  screenX,
                  orb.y + Math.sin(state.time * 3 + orb.x) * 5,
                  8,
                  0,
                  Math.PI * 2,
                );
                targetCtx.fill();
              }
            }
          });

          // Draw Game Player Character
          if (state.tab === "game") {
            const px = game.player.x - game.cameraX;
            const py = game.player.y;

            // Player Shadow
            targetCtx.fillStyle = p[0];
            targetCtx.beginPath();
            targetCtx.ellipse(px, py + 12, 12, 4, 0, 0, Math.PI * 2);
            targetCtx.fill();

            // Faceted Player Body
            targetCtx.fillStyle = p[4];
            targetCtx.shadowColor = p[4];
            targetCtx.shadowBlur = 10;
            targetCtx.beginPath();
            targetCtx.arc(px, py, game.player.radius, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.fillStyle = p[3];
            targetCtx.beginPath();
            targetCtx.arc(px - 3, py - 3, 4, 0, Math.PI * 2);
            targetCtx.fill();
          }

          targetCtx.restore();
        }

        // --- LAYER 4: IMMEDIATE VIGNETTE FRAMING ---
        if (state.layers[4]) {
          targetCtx.fillStyle = p[0];

          // Top Vignette Overhang / Stalactites
          targetCtx.beginPath();
          targetCtx.moveTo(0, 0);
          targetCtx.lineTo(w, 0);
          targetCtx.lineTo(w, 40);
          for (let x = w; x >= 0; x -= 50) {
            targetCtx.lineTo(x, 20 + Math.sin(x * 0.05) * 25);
          }
          targetCtx.closePath();
          targetCtx.fill();

          // Screen Corner Frame Vignette
          const grad = targetCtx.createRadialGradient(
            w / 2,
            h / 2,
            w * 0.3,
            w / 2,
            h / 2,
            w * 0.7,
          );
          grad.addColorStop(0, "rgba(0,0,0,0)");
          grad.addColorStop(1, p[0]);
          targetCtx.fillStyle = grad;
          targetCtx.fillRect(0, 0, w, h);
        }
      }

      // --- LOW-RES BAYER DITHERING PIPELINE ---
      function renderPixelDitherScene() {
        const lw = lowResCanvas.width;
        const lh = lowResCanvas.height;

        // 1. Render vector scene onto low-resolution buffer
        renderVectorScene(lowResCtx, lw, lh);

        // 2. Fetch image buffer and apply ordered Bayer matrix color quantization
        const imgData = lowResCtx.getImageData(0, 0, lw, lh);
        const data = imgData.data;

        // Hex to RGB Helper
        const paletteRGB = state.palette.map((hex) => {
          const num = parseInt(hex.replace("#", ""), 16);
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        });

        for (let y = 0; y < lh; y++) {
          for (let x = 0; x < lw; x++) {
            const idx = (y * lw + x) * 4;
            const r = data[idx];
            const g = data[idx + 1];
            const b = data[idx + 2];

            // Luminance calculation
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;

            // Bayer Threshold Offset
            const bayerValue = BAYER_4X4[y % 4][x % 4] / 16.0 - 0.5;
            const ditheredLum = Math.min(
              255,
              Math.max(0, lum + bayerValue * 64),
            );

            // Quantize to 5 Palette Index Levels
            let toneIdx = Math.floor((ditheredLum / 256) * 5);
            toneIdx = Math.min(4, Math.max(0, toneIdx));

            const targetColor = paletteRGB[toneIdx];
            data[idx] = targetColor[0];
            data[idx + 1] = targetColor[1];
            data[idx + 2] = targetColor[2];
          }
        }

        lowResCtx.putImageData(imgData, 0, 0);

        // 3. Upscale low-res pixel buffer to main canvas
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(lowResCanvas, 0, 0, canvas.width, canvas.height);
      }

      // --- SHADER POST-PROCESSING EFFECTS ---
      function applyPostFX(targetCtx, w, h) {
        if (state.fx === "none") return;

        const p = state.palette;

        if (state.fx === "glitch") {
          // Horizontal Glitch Slicing & Chromatic Offset
          const numSlices = 5;
          for (let i = 0; i < numSlices; i++) {
            if (Math.random() > 0.4) {
              const sy = Math.floor(Math.random() * h);
              const sh = Math.floor(Math.random() * 20) + 5;
              const dx = (Math.random() - 0.5) * 30;
              targetCtx.drawImage(canvas, 0, sy, w, sh, dx, sy, w, sh);
            }
          }
        } else if (state.fx === "rays") {
          // Volumetric God Rays
          targetCtx.save();
          targetCtx.globalCompositeOperation = "screen";
          const rayGrad = targetCtx.createLinearGradient(w * 0.75, 0, 0, h);
          rayGrad.addColorStop(0, p[4]);
          rayGrad.addColorStop(0.5, p[3]);
          rayGrad.addColorStop(1, "transparent");
          targetCtx.fillStyle = rayGrad;

          for (let i = 0; i < 6; i++) {
            targetCtx.beginPath();
            targetCtx.moveTo(w * 0.75, 0);
            const angle = 0.3 + i * 0.15 + Math.sin(state.time + i) * 0.02;
            targetCtx.lineTo(
              Math.cos(angle) * w * 1.5,
              Math.sin(angle) * h * 1.5,
            );
            targetCtx.lineTo(
              Math.cos(angle + 0.05) * w * 1.5,
              Math.sin(angle + 0.05) * h * 1.5,
            );
            targetCtx.fill();
          }
          targetCtx.restore();
        } else if (state.fx === "shimmer") {
          // Water Caustics / Distortion Overlay
          targetCtx.save();
          targetCtx.globalAlpha = 0.15;
          targetCtx.fillStyle = p[4];
          for (let y = h - 120; y < h; y += 10) {
            const shift = Math.sin(state.time * 2 + y * 0.1) * 15;
            targetCtx.fillRect(shift, y, w, 4);
          }
          targetCtx.restore();
        } else if (state.fx === "eldritch") {
          // Cosmic Wave Distortion
          const sliceH = 8;
          for (let y = 0; y < h; y += sliceH) {
            const xOffset = Math.sin(state.time * 3 + y * 0.03) * 8;
            targetCtx.drawImage(canvas, 0, y, w, sliceH, xOffset, y, w, sliceH);
          }
        }
      }

      // Run Engine
      window.onload = init;
    </script>
  </body>
