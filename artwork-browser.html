<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rift Rails: Procedural Pixel Art Dimension Gallery</title>
    <style>
      :root {
        --bg: #111;
        --panel-bg: #1a1a24;
        --text: #f0f0f5;
        --border: #333;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        padding: 40px;
      }

      header {
        text-align: center;
        margin-bottom: 40px;
      }

      header h1 {
        color: #ffb800;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 900;
      }

      header p {
        color: #aaa;
        max-width: 600px;
        margin: 0 auto;
        font-weight: bold;
      }

      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
        gap: 30px;
        width: 100%;
        max-width: 1600px;
        margin: 0 auto;
      }

      .art-card {
        background: var(--panel-bg);
        border: 2px solid var(--border);
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }

      .art-card:hover {
        transform: translateY(-5px);
        border-color: #ffb800;
      }

      .art-title {
        text-transform: uppercase;
        font-weight: 900;
        font-size: 1.1em;
        text-align: center;
        margin: 0;
        color: #fff;
        letter-spacing: 1px;
      }

      .canvas-wrapper {
        width: 100%;
        /* 16:9 Aspect Ratio */
        aspect-ratio: 16 / 9;
        background: #000;
        border: 2px solid #000;
        overflow: hidden;
      }

      /* CRITICAL: Forces the browser to render the canvas sharply without blurring */
      canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }

      /* CSS animations for atmosphere */
      .anim-eldritch {
        animation: pulse-hue 4s infinite alternate ease-in-out;
      }

      .anim-neon {
        animation: neon-flicker 3s infinite;
      }

      @keyframes pulse-hue {
        0% {
          filter: contrast(1.1) brightness(1);
        }
        100% {
          filter: contrast(1.2) brightness(1.2) hue-rotate(15deg);
        }
      }

      @keyframes neon-flicker {
        0%,
        19%,
        21%,
        23%,
        25%,
        54%,
        56%,
        100% {
          filter: contrast(1.2) brightness(1)
            drop-shadow(0 0 5px rgba(0, 255, 255, 0.2));
        }
        20%,
        24%,
        55% {
          filter: contrast(1) brightness(0.5);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Dimensional Registry</h1>
      <p>
        Procedural Pixel Art Engine. 160x90 Base Resolution. Restricted 5-Color
        Palettes. Bayer Matrix Dithering.
      </p>
    </header>

    <div id="gallery"></div>

    <script>
      /** ========================================================
       *  1. SEEDED RNG ENGINE
       *  ======================================================== */
      function generateSeed(str) {
        let h = 0xdeadbeef;
        for (let i = 0; i < str.length; i++) {
          h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
        }
        return (h ^ (h >>> 16)) >>> 0;
      }

      function mulberry32(seed) {
        return function () {
          let t = (seed += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      class SeededRNG {
        constructor(seedString) {
          this.seed = generateSeed(seedString);
          this.random = mulberry32(this.seed);
        }
        next() {
          return this.random();
        }
        range(min, max) {
          return Math.floor(this.random() * (max - min + 1)) + min;
        }
        chance(prob) {
          return this.random() < prob;
        }
      }

      /** ========================================================
       *  2. PIXEL ART RENDERER CLASS
       *  ======================================================== */
      class PixelRenderer {
        constructor(width = 160, height = 90) {
          this.w = width;
          this.h = height;
          this.canvas = document.createElement("canvas");
          this.canvas.width = this.w;
          this.canvas.height = this.h;
          this.ctx = this.canvas.getContext("2d");
          this.imageData = this.ctx.createImageData(this.w, this.h);
          this.buf = new Uint32Array(this.imageData.data.buffer);

          // 4x4 Bayer Dithering Matrix
          this.bayer = [
            [0, 8, 2, 10],
            [12, 4, 14, 6],
            [3, 11, 1, 9],
            [15, 7, 13, 5],
          ];
        }

        setPalette(hexColors) {
          // Convert hex strings to 32-bit integers (ABGR format for Uint32Array)
          this.palette = hexColors.map((hex) => {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (255 << 24) | (b << 16) | (g << 8) | r;
          });
        }

        setPixel(x, y, colorIndex) {
          if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
          // colorIndex 0-4 maps to the 5 colors in the palette
          this.buf[y * this.w + x] =
            this.palette[
              Math.min(Math.max(colorIndex, 0), this.palette.length - 1)
            ];
        }

        // Blends two palette indices using a dither matrix based on x,y coordinates
        // Ratio is 0.0 (color1) to 1.0 (color2)
        setPixelDither(x, y, color1, color2, ratio) {
          if (x < 0 || x >= this.w || y < 0 || y >= this.h) return;
          const threshold = (this.bayer[y % 4][x % 4] + 0.5) / 16;
          const c = ratio > threshold ? color2 : color1;
          this.buf[y * this.w + x] = this.palette[c];
        }

        fill(colorIndex) {
          this.buf.fill(this.palette[colorIndex]);
        }

        // Renders the buffer to the canvas
        present() {
          this.imageData.data.set(new Uint8ClampedArray(this.buf.buffer));
          this.ctx.putImageData(this.imageData, 0, 0);
          return this.canvas;
        }

        // Applies a glitch effect to the buffer directly
        applyGlitch(rng) {
          const slices = rng.range(3, 8);
          for (let i = 0; i < slices; i++) {
            const y = rng.range(0, this.h);
            const height = rng.range(1, 4);
            const offset = rng.range(-5, 5);
            if (offset === 0) continue;

            for (let yy = y; yy < y + height && yy < this.h; yy++) {
              const row = new Uint32Array(
                this.buf.buffer,
                yy * this.w * 4,
                this.w,
              );
              const shifted = new Uint32Array(this.w);
              if (offset > 0) {
                shifted.set(row.subarray(0, this.w - offset), offset);
              } else {
                shifted.set(row.subarray(-offset), 0);
              }
              row.set(shifted);
            }
          }
        }
      }

      /** ========================================================
       *  3. PALETTES (Adjectives)
       *  [Background, Shadow, Midtone, Light, Highlight/Accent]
       *  ======================================================== */
      const PALETTES = {
        Crimson: ["#140205", "#330811", "#7a121e", "#c42127", "#ff5c5c"],
        Neon: ["#05021a", "#1b0a40", "#3a127a", "#ff007f", "#00ffff"],
        Fractured: ["#0a0a0a", "#222222", "#555555", "#999999", "#ffffff"],
        Overgrown: ["#02140a", "#093318", "#17662c", "#33a647", "#85e68b"],
        Clockwork: ["#140d02", "#331f05", "#7a4e0c", "#c4881a", "#ffcc4d"],
        Eldritch: ["#090214", "#1c0733", "#45127a", "#7a22c4", "#c770ff"],
      };

      /** ========================================================
       *  4. NOUN GENERATORS (The Pixel Art Logic)
       *  ======================================================== */
      const Generators = {
        // Spires: Towering geometric structures with pixel shading
        Spire: (r, rng) => {
          // Sky gradient
          for (let y = 0; y < r.h; y++) {
            const ratio = y / r.h;
            for (let x = 0; x < r.w; x++) {
              r.setPixelDither(x, y, 0, 1, ratio * 1.5);
              // Stars
              if (y < 50 && rng.chance(0.01))
                r.setPixel(x, y, rng.chance(0.8) ? 2 : 4);
            }
          }

          // Generate 4-6 Spires back-to-front
          const count = rng.range(4, 7);
          for (let i = 0; i < count; i++) {
            const isFront = i >= count - 2;
            const cx = rng.range(20, r.w - 20);
            const peakY = isFront ? rng.range(10, 40) : rng.range(30, 60);
            const baseW = isFront ? rng.range(40, 80) : rng.range(20, 50);

            // Palette mapping based on depth
            const cShadow = isFront ? 1 : 0;
            const cLit = isFront ? 3 : 2;
            const cHi = isFront ? 4 : 3;

            // Draw spire top-down
            for (let y = peakY; y < r.h; y++) {
              const depthRatio = (y - peakY) / (r.h - peakY);
              // Exponential widening for structural look
              const width = depthRatio * depthRatio * baseW + 2;
              const left = Math.floor(cx - width / 2);
              const right = Math.floor(cx + width / 2);

              for (let x = left; x <= right; x++) {
                // Light comes from the right
                let color = x < cx ? cShadow : cLit;
                // Highlight edge
                if (x === right || x === right - 1) color = cHi;
                // Add dither blending in the middle
                if (Math.abs(x - cx) < 3) {
                  r.setPixelDither(x, y, cShadow, cLit, (x - left) / width);
                } else {
                  r.setPixel(x, y, color);
                }

                // Random tech lights on shadow side
                if (isFront && x < cx - 2 && rng.chance(0.02) && y % 3 === 0) {
                  r.setPixel(x, y, 4);
                }
              }
            }
          }
        },

        // Wastes: Parallax dunes and a giant celestial body
        Wastes: (r, rng) => {
          // Sky and giant planet
          const moonX = rng.range(30, r.w - 30);
          const moonY = rng.range(20, 40);
          const moonR = rng.range(15, 30);

          for (let y = 0; y < r.h; y++) {
            for (let x = 0; x < r.w; x++) {
              r.setPixel(x, y, 0);
              const distSq = (x - moonX) ** 2 + (y - moonY) ** 2;
              if (distSq < moonR ** 2) {
                // Moon shading
                const shadow = (x - moonX + moonR) / (moonR * 2);
                r.setPixelDither(x, y, 2, 4, shadow);
              } else if (rng.chance(0.005) && y < 50) {
                r.setPixel(x, y, 3); // Stars
              }
            }
          }

          // 3 layers of terrain using stacked sine waves
          const layers = 3;
          for (let l = 0; l < layers; l++) {
            const baseY = 40 + l * 20;
            const freq1 = rng.next() * 0.05 + 0.02;
            const freq2 = rng.next() * 0.1;
            const phase = rng.next() * 10;

            const cTop = l + 1; // 1, 2, 3
            const cBot = l; // 0, 1, 2

            for (let x = 0; x < r.w; x++) {
              // Terrain height at x
              const height =
                Math.sin(x * freq1 + phase) * 10 + Math.sin(x * freq2) * 5;
              const yStart = Math.floor(baseY + height);

              // Fill down to bottom
              for (let y = yStart; y < r.h; y++) {
                const depth = (y - yStart) / (r.h - yStart); // 0 at surface, 1 at bottom
                // Dither gradient from top color to bottom color
                r.setPixelDither(x, y, cTop, cBot, depth * 1.5);

                // Surface highlight edge
                if (y === yStart && l === layers - 1) r.setPixel(x, y, 4);
              }
            }
          }
        },

        // Labyrinth: 1-point perspective dungeon crawler view
        Labyrinth: (r, rng) => {
          const cx = r.w / 2;
          const cy = r.h / 2;

          for (let y = 0; y < r.h; y++) {
            for (let x = 0; x < r.w; x++) {
              // Calculate depth based on distance from center
              const dx = Math.abs(x - cx);
              const dy = Math.abs(y - cy);

              // Raycast pseudo-depth
              let depth;
              let isWall = false;

              if (dy * (r.w / r.h) < dx) {
                // Left / Right Walls
                depth = r.w / (dx + 1);
                isWall = true;
              } else {
                // Floor / Ceiling
                depth = r.h / (dy + 1);
              }

              // Normalize depth for coloring (0.0 = far, 1.0 = near)
              let normDepth = Math.max(0, Math.min(1, 1 - depth / 10));

              if (isWall) {
                // Create vertical pillar segments based on depth
                const wallSegment = Math.floor(depth * 4) % 2 === 0;
                let col1 = wallSegment ? 1 : 2;
                let col2 = wallSegment ? 2 : 3;
                r.setPixelDither(x, y, col1, col2, normDepth);

                // Details: Glowing runes on walls randomly
                if (normDepth > 0.3 && rng.chance(0.01)) r.setPixel(x, y, 4);
              } else {
                if (y > cy) {
                  // Floor
                  r.setPixelDither(x, y, 0, 2, normDepth);
                  // Floor grid lines
                  if (
                    Math.floor(dx * depth) % 10 === 0 ||
                    Math.floor(depth * 10) % 5 === 0
                  ) {
                    r.setPixel(x, y, 1);
                  }
                } else {
                  // Ceiling
                  r.setPixel(x, y, 0);
                }
              }
            }
          }

          // Draw a mysterious glowing portal at the end of the hall
          for (let y = cy - 10; y < cy + 15; y++) {
            for (let x = cx - 10; x < cx + 10; x++) {
              const d = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
              if (d < 8) r.setPixelDither(x, y, 3, 4, 1 - d / 8);
            }
          }
        },

        // Nebula: Bilinear interpolated noise clouds
        Nebula: (r, rng) => {
          // 1. Generate a low-res 20x12 noise grid
          const gridW = 20;
          const gridH = 12;
          const noise = new Array(gridW * gridH);
          for (let i = 0; i < noise.length; i++) noise[i] = rng.next();

          // 2. Render upscaled using bilinear interpolation
          for (let y = 0; y < r.h; y++) {
            for (let x = 0; x < r.w; x++) {
              const gx = (x / r.w) * (gridW - 1);
              const gy = (y / r.h) * (gridH - 1);

              const gxi = Math.floor(gx);
              const gyi = Math.floor(gy);
              const tx = gx - gxi;
              const ty = gy - gyi;

              const v00 = noise[gyi * gridW + gxi];
              const v10 = noise[gyi * gridW + gxi + 1];
              const v01 = noise[(gyi + 1) * gridW + gxi];
              const v11 = noise[(gyi + 1) * gridW + gxi + 1];

              // Bilinear interpolation
              const top = v00 * (1 - tx) + v10 * tx;
              const bot = v01 * (1 - tx) + v11 * tx;
              let v = top * (1 - ty) + bot * ty;

              // Threshold into 4 color bands (0, 1, 2, 3)
              v = v * 1.5; // Boost brightness
              if (v < 0.3) r.setPixelDither(x, y, 0, 1, v / 0.3);
              else if (v < 0.6) r.setPixelDither(x, y, 1, 2, (v - 0.3) / 0.3);
              else if (v < 0.9) r.setPixelDither(x, y, 2, 3, (v - 0.6) / 0.3);
              else r.setPixelDither(x, y, 3, 4, Math.min(1, (v - 0.9) / 0.3));

              // Draw sharp stars
              if (rng.chance(0.003)) {
                r.setPixel(x, y, 4);
                if (rng.chance(0.5)) {
                  r.setPixel(x - 1, y, 4);
                  r.setPixel(x + 1, y, 4);
                  r.setPixel(x, y - 1, 4);
                  r.setPixel(x, y + 1, 4);
                }
              }
            }
          }
        },
      };

      /** ========================================================
       *  5. MASTER ASSEMBLER
       *  ======================================================== */
      function buildDimensionCard(adjective, noun) {
        const fullName = `The ${adjective} ${noun}`;
        const rng = new SeededRNG(fullName);

        // Setup Renderer
        const renderer = new PixelRenderer(160, 90);
        renderer.setPalette(PALETTES[adjective] || PALETTES.Fractured);

        // Generate Base Art
        const generator = Generators[noun];
        if (generator) generator(renderer, rng);

        // Apply Adjective-specific post-processing (Glitch)
        if (adjective === "Fractured") renderer.applyGlitch(rng);

        const canvas = renderer.present();

        // Build HTML
        const card = document.createElement("div");
        card.className = "art-card";

        const title = document.createElement("h3");
        title.className = "art-title";
        title.innerText = fullName;

        const container = document.createElement("div");
        container.className = "canvas-wrapper";

        // Add CSS animation classes if applicable
        if (adjective === "Eldritch") canvas.classList.add("anim-eldritch");
        if (adjective === "Neon") canvas.classList.add("anim-neon");

        container.appendChild(canvas);
        card.appendChild(title);
        card.appendChild(container);

        return card;
      }

      /** ========================================================
       *  6. INIT SCRIPT: BUILD THE GALLERY
       *  ======================================================== */
      const ADJECTIVES = [
        "Crimson",
        "Neon",
        "Fractured",
        "Overgrown",
        "Clockwork",
        "Eldritch",
      ];
      const NOUNS = ["Spire", "Wastes", "Labyrinth", "Nebula"];
      const galleryElement = document.getElementById("gallery");

      ADJECTIVES.forEach((adjective) => {
        NOUNS.forEach((noun) => {
          galleryElement.appendChild(buildDimensionCard(adjective, noun));
        });
      });
    </script>
  </body>
</html>
