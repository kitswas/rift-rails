          for (const b of bergs) {
            const bx = b.x,
              bw = b.w,
              bh = b.h;
            const px = bx + b.peakOffset,
              py = waterY - bh;
            const ridgeX = px + bw * 0.12;
            const subL = bx - bw / 2,
              subR = bx + bw / 2;
            const midL = subL + (px - subL) * 0.5,
              midY = py + bh * 0.45;

            // Main Lit Face (Left)
            icebergs += `<polygon points="${subL},${waterY} ${px},${py} ${ridgeX},${waterY}" fill="#ffffff" />`;
            // Upper Highlight Crest
            icebergs += `<polygon points="${midL},${midY} ${px},${py} ${ridgeX},${py + bh * 0.35}" fill="${p[4]}" />`;
            // Main Shadow Face (Right)
            icebergs += `<polygon points="${ridgeX},${waterY} ${px},${py} ${subR},${waterY}" fill="${p[3]}" />`;
            // Deep Shadow Flank (Rightmost Crevasse)
            icebergs += `<polygon points="${ridgeX + (subR - ridgeX) * 0.4},${waterY} ${px},${py} ${subR},${waterY}" fill="${p[2]}" />`;
          }
          icebergs += `</g>`;
          svg += `<g style="filter: drop-shadow(0 -4px 8px rgba(0,0,0,0.45));">${icebergs}</g>`;

          // Layer 3: Foreground Pack Ice Slab
          let floe = `<polygon points="0,450 0,345 280,310 520,355 800,315 800,450" fill="${p[0]}" />`;
          floe += `<polygon points="0,345 280,310 520,355 800,315 800,330 520,370 280,325 0,360" fill="${p[3]}" />`; // Ice edge thickness
          svg += `<g style="filter: drop-shadow(0 -10px 18px rgba(0,0,0,0.85));">${floe}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Jungle (Procedural Asymmetric Primordial Rainforest & Titan Tree)
         * - Depth Plane 1 [Background | Blur 5-6px]: Soft sun glow at infinity, diagonal god rays & ridge
         * - Depth Plane 2 [Far Midground | Blur 1.8px]: Mountain waterfall & splash mist
         * - Depth Plane 2.5 [Water Layer | Lowered Level]: Full-width water plane at y=270..285
         * - Depth Plane 3 [Midground | Blur 0-2px]: Blurred organic canopy masses, Titan Tree & landmasses
         * - Depth Plane 4 [Near Midground | Blur 0px]: Sunny bank fan palms & Victoria amazonica lilies
         * - Depth Plane 5 [Foreground | Blur 0px]: Lianas strictly connecting canopy nodes, macro fronds & fireflies
         * ------------------------------------------------------------------------- */
        Jungle: (rng, p) => {
          // Dynamic Seed-Driven Composition Flip (Left-dominant vs Right-dominant)
          const isLeftDominant = rng.chance(0.5);

          // Sun position and diagonal ray direction
          const sunX = isLeftDominant
            ? rng.range(600, 680)
            : rng.range(120, 200);
          const sunY = rng.range(55, 80);

          let svg = `<defs>
            <linearGradient id="junSky-${rng.seed}" x1="${isLeftDominant ? 0 : 1}" y1="0" x2="${isLeftDominant ? 1 : 0}" y2="1">
              <stop offset="0%" stop-color="${p[4]}"/>
              <stop offset="50%" stop-color="${p[3]}"/>
              <stop offset="100%" stop-color="${p[1]}"/>
            </linearGradient>
            <linearGradient id="junWater-${rng.seed}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${p[3]}"/>
              <stop offset="100%" stop-color="${p[0]}"/>
            </linearGradient>
          </defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#junSky-${rng.seed})" />`;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 1: BACKGROUND (Z ~ Infinity | Blur 5-6px | Soft Glow & Rays)
          // -------------------------------------------------------------------------
          // Soft atmospheric sun glow at distance infinity
          svg += `<circle cx="${sunX}" cy="${sunY}" r="${rng.range(130, 160)}" fill="${p[4]}" opacity="0.3" style="filter: blur(36px);" />`;
          svg += `<circle cx="${sunX}" cy="${sunY}" r="${rng.range(70, 90)}" fill="${p[4]}" opacity="0.55" style="filter: blur(18px);" />`;
          svg += `<circle cx="${sunX}" cy="${sunY}" r="${rng.range(40, 50)}" fill="${p[4]}" opacity="0.8" style="filter: blur(10px);" />`;

          // Volumetric God Rays Streaming across the gorge toward the opposite side
          const rayCount = rng.range(7, 10);
          let rays = `<g style="filter: blur(6px); opacity: 0.38;">`;
          for (let r = 0; r < rayCount; r++) {
            const ang = isLeftDominant
              ? Math.PI * 0.58 + (r / (rayCount - 1)) * (Math.PI * 0.42)
              : Math.PI * 0.42 - (r / (rayCount - 1)) * (Math.PI * 0.42);
            const xFar = sunX - Math.cos(ang) * 850;
            const yFar = sunY + Math.sin(ang) * 650;
            const w = rng.range(28, 45);
            rays += `<polygon points="${sunX},${sunY} ${xFar - w},${yFar} ${xFar + w},${yFar}" fill="${p[4]}" />`;
          }
          rays += `</g>`;
          svg += rays;

          // Birds in Flight along the light corridor
          const birdCount = rng.range(2, 5);
          let birdSvg = `<g stroke-linejoin="round">`;
          for (let b = 0; b < birdCount; b++) {
            const startX = isLeftDominant ? 340 : 460;
            const dirX = isLeftDominant ? 1 : -1;
            const bx =
              startX +
              dirX * b * (170 / Math.max(1, birdCount - 1)) +
              rng.range(-15, 15);
            const by = 55 + b * 22 + rng.range(-8, 8);
            const bs = rng.range(14, 19);
            const bang = isLeftDominant
              ? -14 - b * 4 + rng.range(-6, 6)
              : 14 + b * 4 + rng.range(-6, 6);
            birdSvg += `<g transform="translate(${bx},${by}) rotate(${bang})">`;
            birdSvg += `<polygon points="0,0 -${bs * 0.9},-${bs * 0.55} 0,-${bs * 0.25} ${bs * 0.9},-${bs * 0.55}" fill="${p[0]}" />`;
            birdSvg += `<polygon points="0,0 -${bs * 0.75},-${bs * 0.65} 0,-${bs * 0.35}" fill="${p[1]}" />`;
            birdSvg += `<polygon points="0,0 ${bs * 0.75},-${bs * 0.65} 0,-${bs * 0.35}" fill="${p[2]}" />`;
            birdSvg += `<polygon points="0,-${bs * 0.35} ${bs * 0.12},${bs * 0.3} 0,${bs * 1.0} -${bs * 0.12},${bs * 0.3}" fill="${p[0]}" />`;
            birdSvg += `<polygon points="0,-${bs * 0.35} ${bs * 0.1},-${bs * 0.55} 0,-${bs * 0.5}" fill="${p[4]}" />`;
            birdSvg += `</g>`;
          }
          birdSvg += `</g>`;
          svg += birdSvg;

          // Distant Sloping Rainforest Ridge (Descending toward sun side)
          let distRidge = `<g style="filter: blur(5px); opacity: 0.65;">`;
          const ridgeCount = 7;
          for (let i = 0; i < ridgeCount; i++) {
            const rx = (i / (ridgeCount - 1)) * 760 + 20 + rng.range(-10, 10);
            const t = isLeftDominant
              ? i / (ridgeCount - 1)
              : (ridgeCount - 1 - i) / (ridgeCount - 1);
            const ry = 135 + t * 70 + rng.range(-8, 8);
            const rr = rng.range(65, 95);
            distRidge += `<ellipse cx="${rx}" cy="${ry + 10}" rx="${rr}" ry="${rr * 0.45}" fill="${p[1]}" />`;
            distRidge += `<circle cx="${rx}" cy="${ry}" r="${rr}" fill="${p[2]}" />`;
            distRidge += `<ellipse cx="${rx}" cy="${ry - rr * 0.35}" rx="${rr * 0.8}" ry="${rr * 0.38}" fill="${p[3]}" />`;
          }
          distRidge += `</g>`;
          svg += distRidge;

          // Atmospheric Mist Blanket across Far Gorge
          svg += `<path d="M -50,160 Q 250,135 520,185 T 850,170 L 850,240 Q 550,260 250,225 T -50,240 Z" fill="${p[4]}" opacity="0.32" style="filter: blur(14px);" />`;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 2: FAR MIDGROUND (Z ~ 500m | Blur 1.8px | Gorge Waterfall)
          // -------------------------------------------------------------------------
          const fallX = isLeftDominant
            ? rng.range(230, 290)
            : rng.range(510, 570);
          let farMid = `<g stroke-linejoin="round" style="filter: blur(1.8px);">`;
          farMid += `<polygon points="${fallX - 30},180 ${fallX + 30},180 ${fallX + 35},205 ${fallX - 35},205" fill="${p[4]}" />`;
          farMid += `<polygon points="${fallX - 38},205 ${fallX + 38},205 ${fallX + 44},235 ${fallX - 44},235" fill="#ffffff" opacity="0.92" />`;
          farMid += `<polygon points="${fallX - 48},235 ${fallX + 48},235 ${fallX + 55},268 ${fallX - 55},268" fill="${p[3]}" />`;
          farMid += `</g>`;
          svg += farMid;

          // Waterfall Splash Foam Mist
          svg += `<ellipse cx="${fallX}" cy="268" rx="72" ry="18" fill="#ffffff" opacity="0.45" style="filter: blur(8px);" />`;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 2.5: WATER LAYER (Lowered Level intersecting land margins)
          // -------------------------------------------------------------------------
          const waterY = rng.range(270, 285);
          let water = `<g style="filter: drop-shadow(0px -3px 8px rgba(0,0,0,0.35));">`;
          water += `<rect x="0" y="${waterY}" width="800" height="${450 - waterY}" fill="url(#junWater-${rng.seed})" />`;
          for (let i = 0; i < 6; i++) {
            const gy = waterY + 16 + i * 26 + rng.range(-3, 3);
            const gx = 220 + (i % 3) * 80 + rng.range(-20, 30);
            const gw = rng.range(50, 95);
            water += `<rect x="${gx}" y="${gy}" width="${gw}" height="2.2" rx="1.1" fill="#ffffff" opacity="${(0.4 + (i % 3) * 0.15).toFixed(2)}" />`;
          }
          water += `</g>`;
          svg += water;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 3: MIDGROUND TERRAIN & TITAN TREE
          // -------------------------------------------------------------------------
          let landmasses = `<g stroke-linejoin="round">`;
          if (isLeftDominant) {
            // Left High Bank under Titan Tree
            landmasses += `<polygon points="0,450 0,265 240,255 290,345 160,450" fill="${p[1]}" />`;
            landmasses += `<polygon points="0,265 240,255 280,280 0,300" fill="${p[2]}" />`;
            // Right Sloping Bank
            landmasses += `<polygon points="800,450 800,285 530,275 450,355 590,450" fill="${p[1]}" />`;
            landmasses += `<polygon points="800,285 530,275 490,300 800,315" fill="${p[2]}" />`;
          } else {
            // Right High Bank under Titan Tree
            landmasses += `<polygon points="800,450 800,265 560,255 510,345 640,450" fill="${p[1]}" />`;
            landmasses += `<polygon points="800,265 560,255 520,280 800,300" fill="${p[2]}" />`;
            // Left Sloping Bank
            landmasses += `<polygon points="0,450 0,285 270,275 350,355 210,450" fill="${p[1]}" />`;
            landmasses += `<polygon points="0,285 270,275 310,300 0,315" fill="${p[2]}" />`;
          }
          landmasses += `</g>`;
          svg += `<g style="filter: drop-shadow(0 -4px 10px rgba(0,0,0,0.45));">${landmasses}</g>`;

          // MONUMENTAL TITAN TREE (Left or Right Rooted)
          const treeX = isLeftDominant
            ? rng.range(130, 170)
            : rng.range(630, 670);
          const treeY = rng.range(105, 120);

          // 1. Organic Multi-Lobed Blurred Canopy Foliage Masses (Stored in array so lianas can anchor directly to them)
          const canopyCount = rng.range(5, 7);
          const canopyNodes = [];
          let canopySvg = `<g style="filter: blur(2.2px); opacity: 0.95;">`;
          for (let c = 0; c < canopyCount; c++) {
            const startX = isLeftDominant ? 30 : 770;
            const spanX = isLeftDominant ? 480 : -480;
            const cx =
              startX + c * (spanX / (canopyCount - 1)) + rng.range(-12, 12);
            const cy = 55 + Math.abs(c - 2) * 14 + rng.range(-8, 8);
            const cr = rng.range(75, 105);
            canopyNodes.push({ x: cx, y: cy, r: cr });

            // Under-canopy shadow base
            canopySvg += `<ellipse cx="${cx}" cy="${cy + 12}" rx="${cr}" ry="${cr * 0.6}" fill="${p[0]}" opacity="0.85" />`;
            // Midtone foliage volume
            canopySvg += `<ellipse cx="${cx}" cy="${cy}" rx="${cr * 0.92}" ry="${cr * 0.58}" fill="${p[1]}" />`;
            canopySvg += `<ellipse cx="${cx + (isLeftDominant ? 6 : -6)}" cy="${cy - 6}" rx="${cr * 0.78}" ry="${cr * 0.48}" fill="${p[2]}" />`;
            // Sunlit crest
            canopySvg += `<ellipse cx="${cx + (isLeftDominant ? 14 : -14)}" cy="${cy - 14}" rx="${cr * 0.62}" ry="${cr * 0.38}" fill="${p[3]}" />`;
          }
          canopySvg += `</g>`;
          svg += canopySvg;

          // 2. Heavy Main Trunk & Cantilever Boughs
          let titanTrunk = `<g stroke-linejoin="round">`;
          const dir = isLeftDominant ? 1 : -1;
          // Main Trunk Column
          titanTrunk += `<path d="M ${treeX - 50 * dir},${treeY} Q ${treeX - 30 * dir},240 ${treeX - 90 * dir},420 L ${treeX},420 Q ${treeX + 40 * dir},260 ${treeX + 30 * dir},${treeY} Z" fill="${p[3]}" />`;
          titanTrunk += `<path d="M ${treeX - 10 * dir},${treeY} Q ${treeX + 10 * dir},240 ${treeX - 20 * dir},420 L ${treeX + 50 * dir},420 Q ${treeX + 70 * dir},260 ${treeX + 60 * dir},${treeY} Z" fill="${p[2]}" />`;

          // Cantilever Bough reaching out over the river toward open canopy
          titanTrunk += `<path d="M ${treeX + 10 * dir},115 Q ${treeX + 170 * dir},105 ${treeX + 330 * dir},125 L ${treeX + 320 * dir},145 Q ${treeX + 160 * dir},130 ${treeX + 20 * dir},150 Z" fill="${p[1]}" />`;
          titanTrunk += `<path d="M ${treeX + 20 * dir},115 Q ${treeX + 170 * dir},110 ${treeX + 325 * dir},130 L ${treeX + 320 * dir},138 Q ${treeX + 170 * dir},120 ${treeX + 30 * dir},135 Z" fill="${p[3]}" />`;

          // 3. Sweeping Buttress Root Outriggers
          const roots = isLeftDominant
            ? [
                {
                  startX: treeX - 40,
                  startY: 160,
                  endX: 20 + rng.range(-10, 10),
                  midX: 40,
                  col: p[3],
                  w: 60,
                },
                {
                  startX: treeX,
                  startY: 170,
                  endX: 120 + rng.range(-10, 10),
                  midX: 110,
                  col: p[4],
                  w: 55,
                },
                {
                  startX: treeX + 40,
                  startY: 165,
                  endX: 260 + rng.range(-10, 10),
                  midX: 220,
                  col: p[1],
                  w: 65,
                },
              ]
            : [
                {
                  startX: treeX + 40,
                  startY: 160,
                  endX: 780 + rng.range(-10, 10),
                  midX: 760,
                  col: p[3],
                  w: 60,
                },
                {
                  startX: treeX,
                  startY: 170,
                  endX: 680 + rng.range(-10, 10),
                  midX: 690,
                  col: p[4],
                  w: 55,
                },
                {
                  startX: treeX - 40,
                  startY: 165,
                  endX: 540 + rng.range(-10, 10),
                  midX: 580,
                  col: p[1],
                  w: 65,
                },
              ];
          for (const r of roots) {
            titanTrunk += `<path d="M ${r.startX},${r.startY} Q ${r.midX},290 ${r.endX},450 L ${r.endX + r.w * dir},450 Q ${r.midX + 45 * dir},310 ${r.startX + 22 * dir},${r.startY} Z" fill="${r.col}" />`;
          }

          // 4. Vertical Aerial Stilt Roots dropping from overhanging bough into water
          const stiltRoots = isLeftDominant
            ? [
                { x: 260, yTop: 115, yBot: 330, w: 5, col: p[2] },
                { x: 330, yTop: 112, yBot: 350, w: 5, col: p[3] },
                { x: 420, yTop: 120, yBot: 320, w: 4.5, col: p[1] },
              ]
            : [
                { x: 540, yTop: 115, yBot: 330, w: 5, col: p[2] },
                { x: 470, yTop: 112, yBot: 350, w: 5, col: p[3] },
                { x: 380, yTop: 120, yBot: 320, w: 4.5, col: p[1] },
              ];
          for (const sr of stiltRoots) {
            titanTrunk += `<polygon points="${sr.x - sr.w / 2},${sr.yTop} ${sr.x + sr.w / 2},${sr.yTop} ${sr.x + sr.w * 0.7},${sr.yBot} ${sr.x - sr.w * 0.7},${sr.yBot}" fill="${sr.col}" />`;
          }
          titanTrunk += `</g>`;
          svg += `<g style="filter: drop-shadow(0 -8px 20px rgba(0,0,0,0.7));">${titanTrunk}</g>`;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 4: NEAR MIDGROUND (Z ~ 20m | Blur 0px | Palms & Lilies)
          // -------------------------------------------------------------------------
          function drawDetailedPalm(
            cx,
            cy,
            radius,
            numBlades,
            rotDeg,
            curveSign,
            colLit,
            colDark,
          ) {
            let palm = `<g transform="translate(${cx},${cy}) rotate(${rotDeg})" stroke-linejoin="round">`;
            palm += `<path d="M 0,0 Q ${curveSign * radius * 0.2},-${radius * 0.5} 0,-${radius}" fill="none" stroke="${p[0]}" stroke-width="1.8" />`;
            for (let b = 0; b < numBlades; b++) {
              const t = (b - (numBlades - 1) / 2) / numBlades;
              const ang = t * (Math.PI * 0.82);
              const tipX =
                Math.sin(ang) * radius +
                curveSign * (Math.pow(t, 2) * radius * 0.28);
              const tipY =
                -Math.cos(ang) * radius + Math.abs(t) * radius * 0.22;
              const sideX = Math.sin(ang + 0.15) * (radius * 0.45);
              const sideY = -Math.cos(ang + 0.15) * (radius * 0.45);
              const col = b % 2 === 0 ? colLit : colDark;
              palm += `<polygon points="0,0 ${sideX.toFixed(1)},${sideY.toFixed(1)} ${tipX.toFixed(1)},${tipY.toFixed(1)} 0,0" fill="${col}" stroke="${p[0]}" stroke-width="0.9" />`;
            }
            palm += `</g>`;
            return palm;
          }

          let flora = `<g>`;
          // Palms on Sunny Bank (Reaching toward open water)
          const sunnyPalmCount = rng.range(3, 5);
          for (let i = 0; i < sunnyPalmCount; i++) {
            const startX = isLeftDominant ? 530 : 270;
            const spanX = isLeftDominant ? 200 : -200;
            const px =
              startX + i * (spanX / (sunnyPalmCount - 1)) + rng.range(-10, 10);
            const py = 320 + i * 12 + rng.range(-8, 8);
            const pr = rng.range(85, 115);
            const pblades = rng.range(7, 11);
            const prot = isLeftDominant
              ? 16 + i * 8 + rng.range(-6, 6)
              : -16 - i * 8 + rng.range(-6, 6);
            const pcurve =
              i % 2 === 0 ? (isLeftDominant ? 1 : -1) : isLeftDominant ? -1 : 1;
            const pcolLit = i % 2 === 0 ? p[4] : p[3];
            const pcolDark = i % 2 === 0 ? p[2] : p[1];
            flora += drawDetailedPalm(
              px,
              py,
              pr,
              pblades,
              prot,
              pcurve,
              pcolLit,
              pcolDark,
            );
          }

          // Shaded Ferns at Tree Roots
          const rootFernCount = rng.range(1, 3);
          for (let i = 0; i < rootFernCount; i++) {
            const fx = isLeftDominant
              ? 210 + i * 40 + rng.range(-8, 8)
              : 590 - i * 40 + rng.range(-8, 8);
            const fy = 345 + i * 15 + rng.range(-6, 6);
            const frot = isLeftDominant ? -24 + i * 10 : 24 - i * 10;
            flora += drawDetailedPalm(
              fx,
              fy,
              rng.range(75, 90),
              7,
              frot,
              isLeftDominant ? -1 : 1,
              p[3],
              p[1],
            );
          }

          // Victoria Amazonica Water Lilies in River Channel
          const lilyPads = [
            {
              cx: 380 + rng.range(-15, 15),
              cy: 375 + rng.range(-5, 5),
              rx: 34,
              ry: 10,
              col: p[3],
            },
            {
              cx: 480 + rng.range(-15, 15),
              cy: 405 + rng.range(-5, 5),
              rx: 42,
              ry: 12,
              col: p[2],
            },
            {
              cx: 410 + rng.range(-15, 15),
              cy: 435 + rng.range(-5, 5),
              rx: 48,
              ry: 14,
              col: p[3],
            },
          ];
          for (const lp of lilyPads) {
            flora += `<ellipse cx="${lp.cx}" cy="${lp.cy}" rx="${lp.rx}" ry="${lp.ry}" fill="${lp.col}" stroke="${p[0]}" stroke-width="1.3" />`;
            flora += `<ellipse cx="${lp.cx}" cy="${lp.cy - 1}" rx="${lp.rx * 0.85}" ry="${lp.ry * 0.78}" fill="${p[4]}" opacity="0.6" />`;
            flora += `<polygon points="${lp.cx},${lp.cy - 13} ${lp.cx - 7},${lp.cy - 2} ${lp.cx + 7},${lp.cy - 2}" fill="#ffffff" />`;
            flora += `<polygon points="${lp.cx},${lp.cy - 10} ${lp.cx - 4},${lp.cy - 2} ${lp.cx + 4},${lp.cy - 2}" fill="${p[4]}" />`;
            flora += `<circle cx="${lp.cx}" cy="${lp.cy - 4}" r="2.2" fill="#ffffff" />`;
          }
          flora += `</g>`;
          svg += `<g style="filter: drop-shadow(0 -4px 10px rgba(0,0,0,0.55));">${flora}</g>`;

          // -------------------------------------------------------------------------
          // DEPTH PLANE 5: FOREGROUND (LIANAS ONLY CONNECTING CANOPY NODES)
          // -------------------------------------------------------------------------
          let vines = `<g stroke-linecap="round">`;
          // Lianas dynamically anchored strictly between adjacent canopy nodes and tree boughs
          for (let i = 0; i < canopyNodes.length - 1; i += 2) {
            const n1 = canopyNodes[i];
            const n2 = canopyNodes[i + 1];
            const dip = rng.range(75, 110);
            const midX = (n1.x + n2.x) / 2;
            const midY = (n1.y + n2.y) / 2 + dip;

            // Primary Heavy Braided Liana Loop
            vines += `<path d="M ${n1.x},${n1.y + n1.r * 0.4} Q ${midX},${midY} ${n2.x},${n2.y + n2.r * 0.4}" fill="none" stroke="${p[0]}" stroke-width="4.5" />`;
            vines += `<path d="M ${n1.x},${n1.y + n1.r * 0.4} Q ${midX + 4},${midY + 2} ${n2.x},${n2.y + n2.r * 0.4}" fill="none" stroke="${p[1]}" stroke-width="1.8" />`;
            // Secondary Tendril Loop
            vines += `<path d="M ${midX - 25},${midY - 8} Q ${midX},${midY + 22} ${midX + 25},${midY - 8}" fill="none" stroke="${p[0]}" stroke-width="2" />`;

            // Luminous Epiphyte Orchid Node
            vines += `<circle cx="${midX}" cy="${midY}" r="16" fill="${p[4]}" opacity="0.45" style="filter: blur(5px);" />`;
            vines += `<polygon points="${midX},${midY - 9} ${midX - 6},${midY} ${midX},${midY + 9} ${midX + 6},${midY}" fill="${p[4]}" />`;
            vines += `<circle cx="${midX}" cy="${midY}" r="3" fill="#ffffff" />`;
            vines += `<polygon points="${midX - 4},${midY + 3} ${midX - 14},${midY + 12} ${midX - 2},${midY + 7}" fill="${p[2]}" />`;
            vines += `<polygon points="${midX + 4},${midY + 3} ${midX + 14},${midY + 12} ${midX + 2},${midY + 7}" fill="${p[2]}" />`;
          }
          vines += `</g>`;

          // Foreground Macro Framing Silhouette
          let fore = `<g stroke-linejoin="round">`;
          if (isLeftDominant) {
            fore += `<path d="M 0,0 L 320,0 Q 210,105 0,150 Z" fill="${p[0]}" />`;
            fore += `<path d="M 800,0 L 620,0 Q 690,75 800,105 Z" fill="${p[0]}" />`;
            fore += drawDetailedPalm(30, 445, 185, 11, -44, -1, p[1], p[0]);
            fore += drawDetailedPalm(95, 450, 150, 9, -28, -1, p[2], p[0]);
            fore += drawDetailedPalm(770, 440, 160, 9, 42, 1, p[1], p[0]);
          } else {
            fore += `<path d="M 800,0 L 480,0 Q 590,105 800,150 Z" fill="${p[0]}" />`;
            fore += `<path d="M 0,0 L 180,0 Q 110,75 0,105 Z" fill="${p[0]}" />`;
            fore += drawDetailedPalm(770, 445, 185, 11, 44, 1, p[1], p[0]);
            fore += drawDetailedPalm(705, 450, 150, 9, 28, 1, p[2], p[0]);
            fore += drawDetailedPalm(30, 440, 160, 9, -42, -1, p[1], p[0]);
          }

          // Ground Base Humidity Mist Blanket
          fore += `<ellipse cx="380" cy="445" rx="360" ry="28" fill="${p[2]}" opacity="0.38" style="filter: blur(14px);" />`;
          fore += `<polygon points="0,450 0,405 220,380 380,430 540,390 800,410 800,450" fill="${p[0]}" />`;

          // Bounded Randomness: Floating Firefly Swarm
          const fireflyCount = rng.range(10, 16);
          for (let f = 0; f < fireflyCount; f++) {
            const fx = 70 + f * (680 / (fireflyCount - 1)) + rng.range(-20, 20);
            const fy = 270 + (f % 4) * 38 + rng.range(-12, 12);
            fore += `<circle cx="${fx}" cy="${fy}" r="5.5" fill="${p[4]}" opacity="0.5" style="filter: blur(2.5px);" />`;
            fore += `<circle cx="${fx}" cy="${fy}" r="1.8" fill="#ffffff" />`;
          }
          fore += `</g>`;

          svg += `<g style="filter: drop-shadow(0 -16px 26px rgba(0,0,0,0.95));">${vines}${fore}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Dominion (Grand Medieval Citadel Castle, Interlocking Spires & Parapets)
         * - Layer 0 [Sky]: 95% Eclipsed Sun/Moon Corona (Prominent in sky)
         * - Layer 1 [Distant Plane]: Distant curtain wall ridges & spires (blur)
         * - Layer 2 [Midground Citadel]: Lowered towers with uniform slope roofs (tip at 1/4th of sun)
         * - Layer 3 [Foreground Gatehouse]: Heavy crenelated curtain wall with portcullis arch
         * ------------------------------------------------------------------------- */
        Dominion: (rng, p) => {
          let svg = `<defs><linearGradient id="domSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[1]}"/><stop offset="100%" stop-color="${p[4]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#domSky-${rng.seed})" />`;

          // Layer 0: 95% Eclipsed Sun/Moon Corona (Sun top at y=80, bottom at y=180, cy=130, r=50)
          svg += `<circle cx="400" cy="130" r="95" fill="${p[4]}" opacity="0.45" style="filter: blur(20px);" />`;
          // Glowing Luminous Sun Disc
          svg += `<circle cx="400" cy="130" r="50" fill="${p[4]}" />`;
          // 95% Occluding Dark Moon (slight 1.5px offset leaves a crisp 5% glowing corona crescent)
          svg += `<circle cx="398.5" cy="128.5" r="48.5" fill="${p[0]}" />`;

          // Layer 1: Distant Mountain Curtain Walls
          svg += `<polygon points="0,450 0,220 240,180 560,180 800,230 800,450" fill="${p[2]}" style="filter: blur(3px); opacity: 0.75;" />`;

          // Layer 2: Main Faceted Castle Citadel
          // Uniform Roof Steepness (slope k = 2.0).
          // Central Keep apex is at y=105 (exactly 1/4th down from top of sun at y=80).
          let citadel = `<g stroke-linejoin="round">`;

          function drawTower(
            baseL,
            baseR,
            topY,
            roofApexY,
            colShaftLit,
            colShaftDark,
            colRoof,
          ) {
            const midX = (baseL + baseR) / 2;
            let t = "";
            // Tower Shaft - Lit Left Half
            t += `<polygon points="${baseL},340 ${baseL},${topY} ${midX},${topY} ${midX},340" fill="${colShaftLit}" />`;
            // Tower Shaft - Shadow Right Half
            t += `<polygon points="${midX},340 ${midX},${topY} ${baseR},${topY} ${baseR},340" fill="${colShaftDark}" />`;
            // Conical Roof sitting cleanly on horizontal top line with same steepness
            t += `<polygon points="${baseL - 2},${topY} ${midX},${roofApexY} ${baseR + 2},${topY}" fill="${colRoof}" />`;
            return t;
          }

          // Outer Flank Towers (w=50, half-width=25 -> roof height=50)
          citadel += drawTower(170, 220, 230, 180, p[2], p[1], p[3]);
          citadel += drawTower(580, 630, 230, 180, p[2], p[1], p[3]);

          // Inner Mid Towers (w=60, half-width=30 -> roof height=60)
          citadel += drawTower(270, 330, 210, 150, p[3], p[1], p[4]);
          citadel += drawTower(470, 530, 210, 150, p[3], p[1], p[4]);

          // Central High Keep (w=80, half-width=40 -> roof height=80, apex at y=105, shaft top at y=185)
          citadel += `<polygon points="360,340 360,185 400,185 400,340" fill="${p[3]}" />`;
          citadel += `<polygon points="400,340 400,185 440,185 440,340" fill="${p[1]}" />`;
          citadel += `<polygon points="356,185 400,105 444,185" fill="${p[4]}" />`;

          citadel += `</g>`;
          svg += `<g style="filter: drop-shadow(0 -8px 16px rgba(0,0,0,0.7));">${citadel}</g>`;

          // Layer 3: Foreground Fortified Gatehouse & Crenelated Ramparts
          let gate = `<polygon points="0,450 0,310 800,310 800,450" fill="${p[0]}" />`;
          for (let x = 40; x <= 760; x += 30) {
            gate += `<rect x="${x}" y="290" width="16" height="20" fill="${p[0]}" />`;
          }
          // Arched Gate Portal
          gate += `<path d="M 360,450 L 360,360 Q 400,330 440,360 L 440,450 Z" fill="${p[4]}" opacity="0.25" />`;
          gate += `<path d="M 370,450 L 370,370 Q 400,345 430,370 L 430,450 Z" fill="${p[1]}" />`;

          svg += `<g style="filter: drop-shadow(0 -12px 22px rgba(0,0,0,0.9));">${gate}</g>`;
          return svg;
        },

        // =========================================================================
        // RES ARTIFACTS (Vistas, Minerals & Natural Extraction)
        // =========================================================================

        /* -------------------------------------------------------------------------
         * NOUN: Wastes (Layered Atmospheric Ridge Cutouts)
         * - Layer 0 [Sky]: Desolation gradient
         * - Layers 1..6 [Stepped Depth]: Progressive atmospheric fade with drop-shadows
         * ------------------------------------------------------------------------- */
        Wastes: (rng, p) => {
          let svg = `<defs><linearGradient id="wasteSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[0]}"/><stop offset="60%" stop-color="${p[2]}"/><stop offset="100%" stop-color="${p[4]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#wasteSky-${rng.seed})" />`;
          const layers = 6;
          for (let l = 0; l < layers; l++) {
            const depth = l / (layers - 1),
              sy = 120 + l * 45;
            let pts = `-50,450 -50,${sy} `,
              cx = -50;
            while (cx < 850) {
              cx += rng.range(80, 180);
              pts += `${cx},${sy + rng.range(-40, 40)} `;
            }
            pts += `850,450`;
            const col =
              l === layers - 1 ? p[0] : l > 3 ? p[1] : l > 1 ? p[2] : p[3];
            const blurAmt = Math.max(0, (1 - depth) * 6);
            const filterStyle =
              blurAmt > 0.5
                ? `style="filter: blur(${blurAmt.toFixed(1)}px); opacity: ${(0.6 + depth * 0.4).toFixed(2)};"`
                : `style="filter: drop-shadow(0px -${(l + 1) * 3}px ${(l + 1) * 3}px rgba(0,0,0,0.6));"`;
            svg += `<polygon points="${pts}" fill="${col}" ${filterStyle} />`;
          }
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Quarry (Stepped Ancient Megalithic Ziggurat Excavation)
         * - Layer 0 [Sky]: Open excavation pit sky
         * - Layers 1..5 [Terraces]: Concentric faceted cut tiers stepping down
         * ------------------------------------------------------------------------- */
        Quarry: (rng, p) => {
          let svg = `<defs><linearGradient id="quarrySky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="100%" stop-color="${p[1]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#quarrySky-${rng.seed})" />`;
          for (let s = 0; s < 5; s++) {
            const pad = s * 70,
              y = 140 + s * 55;
            let step = `<polygon points="${pad},450 ${pad + 40},${y} ${800 - pad - 40},${y} ${800 - pad},450" fill="${p[Math.min(4, Math.max(0, 4 - s))]}" />`;
            step += `<polygon points="${pad + 40},${y} ${pad + 70},${y + 35} ${800 - pad - 70},${y + 35} ${800 - pad - 40},${y}" fill="${p[Math.min(3, Math.max(0, 3 - s))]}" />`;
            const filter =
              s === 0
                ? `style="filter: blur(3px);"`
                : `style="filter: drop-shadow(0 -6px 10px rgba(0,0,0,0.6));"`;
            svg += `<g ${filter}>${step}</g>`;
          }
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Nebula (Deep Space Volumetric Gas Clouds & Star Halos)
         * - Layer 0 [Void]: Deep space base
         * - Layer 1 [Deep Field]: Massive macro-blurred ionized dust clouds (blur 28px)
         * - Layer 2 [Mid Field]: Luminous gas filaments (blur 14px)
         * - Layer 3 [Optics]: Point-source stars with diffraction bloom (no physical shadows)
         * ------------------------------------------------------------------------- */
        Nebula: (rng, p) => {
          let svg = `<rect width="100%" height="100%" fill="${p[0]}" />`;
          let deepPolys = "";
          for (let i = 0; i < 16; i++) {
            const cx = rng.range(40, 760),
              cy = rng.range(30, 370),
              r = rng.range(80, 180),
              sides = rng.range(6, 9);
            let pts = "";
            for (let s = 0; s < sides; s++) {
              const ang = (s / sides) * Math.PI * 2,
                rad = (r * rng.range(75, 125)) / 100;
              pts += `${cx + Math.cos(ang) * rad},${cy + Math.sin(ang) * rad} `;
            }
            deepPolys += `<polygon points="${pts}" fill="${p[Math.floor((i / 16) * 3) + 1]}" opacity="0.45" />`;
          }
          svg += `<g style="filter: blur(28px); opacity: 0.75;">${deepPolys}</g>`;
          let midPolys = "";
          for (let i = 0; i < 20; i++) {
            const cx = rng.range(20, 780),
              cy = rng.range(20, 380),
              r = rng.range(45, 110),
              sides = rng.range(5, 8);
            let pts = "";
            for (let s = 0; s < sides; s++) {
              const ang = (s / sides) * Math.PI * 2,
                rad = (r * rng.range(80, 120)) / 100;
              pts += `${cx + Math.cos(ang) * rad},${cy + Math.sin(ang) * rad} `;
            }
            midPolys += `<polygon points="${pts}" fill="${p[Math.floor((i / 20) * 3) + 2]}" opacity="0.6" />`;
          }
          svg += `<g style="filter: blur(14px); opacity: 0.85;">${midPolys}</g>`;
          let stars = "";
          for (let i = 0; i < 55; i++) {
            const sx = rng.range(0, 800),
              sy = rng.range(0, 400),
              op = rng.next() * 0.7 + 0.3;
            if (rng.chance(0.25)) {
              const s = rng.range(2, 5);
              stars += `<polygon points="${sx},${sy - s} ${sx + s * 0.3},${sy} ${sx},${sy + s} ${sx - s * 0.3},${sy}" fill="${p[4]}" opacity="${op}" />`;
            } else {
              stars += `<circle cx="${sx}" cy="${sy}" r="${rng.next() * 1.3 + 0.4}" fill="${p[4]}" opacity="${op}" />`;
            }
          }
          svg += `<g style="filter: drop-shadow(0 0 3px ${p[4]});">${stars}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Crags (Interlocking Multi-Faceted Rock Needles with Shared Ridges)
         * - Layer 0 [Sky]: Vertical gorge sky gradient
         * - Layer 1 [Distant Plane]: Far misty spires (blur)
         * - Layer 2 [Midground Crags]: Secondary leaning faceted rock pillars
         * - Layer 3 [Foreground Crags]: Massive foreground interlocking rock blades with shared vertices
         * ------------------------------------------------------------------------- */
        Crags: (rng, p) => {
          let svg = `<defs><linearGradient id="cragSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="100%" stop-color="${p[0]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#cragSky-${rng.seed})" />`;

          // Layer 1: Distant Misty Needle Spires (Blur)
          let dist = "";
          for (let i = 0; i < 5; i++) {
            const x = 70 + i * 160 + rng.range(-20, 20),
              h = rng.range(200, 290),
              w = rng.range(70, 110);
            dist += `<polygon points="${x - w / 2},450 ${x},${450 - h} ${x + w / 2},450" fill="${p[2]}" />`;
          }
          svg += `<g style="filter: blur(4px); opacity: 0.65;">${dist}</g>`;

          // Function to generate multi-faceted rock needles with shared interior vertices
          function generateCragCluster(
            cx,
            topY,
            width,
            colLit,
            colMid,
            colDark,
          ) {
            const botY = 450;
            const midY = topY + (botY - topY) * 0.45;
            const spineX = cx - width * 0.12;
            const leftX = cx - width / 2;
            const rightX = cx + width / 2;
            const shelfX = cx + width * 0.25;

            let rock = `<g stroke-linejoin="round">`;
            // Primary Lit Face (Top to Spine)
            rock += `<polygon points="${leftX},${botY} ${cx},${topY} ${spineX},${midY}" fill="${colLit}" />`;
            // Lower Lit Flank
            rock += `<polygon points="${leftX},${botY} ${spineX},${midY} ${cx},${botY}" fill="${colMid}" />`;
            // Primary Shadow Face (Top to Ridge)
            rock += `<polygon points="${cx},${topY} ${rightX},${botY} ${shelfX},${midY}" fill="${colDark}" />`;
            // Secondary Shadow Shelf
            rock += `<polygon points="${spineX},${midY} ${shelfX},${midY} ${cx},${botY}" fill="${colDark}" opacity="0.85" />`;
            rock += `<polygon points="${shelfX},${midY} ${rightX},${botY} ${cx},${botY}" fill="${colDark}" />`;
            rock += `</g>`;
            return rock;
          }

          // Layer 2: Midground Leaning Rock Pillars
          let midCrags = "";
          midCrags += generateCragCluster(220, 160, 160, p[3], p[2], p[1]);
          midCrags += generateCragCluster(580, 140, 180, p[3], p[2], p[1]);
          svg += `<g style="filter: drop-shadow(0 -6px 12px rgba(0,0,0,0.6));">${midCrags}</g>`;

          // Layer 3: Foreground Giant Interlocking Rock Needles
          let foreCrags = "";
          foreCrags += generateCragCluster(100, 100, 220, p[3], p[1], p[0]);
          foreCrags += generateCragCluster(380, 60, 260, p[4], p[2], p[0]);
          foreCrags += generateCragCluster(700, 80, 240, p[3], p[1], p[0]);
          svg += `<g style="filter: drop-shadow(0 -12px 24px rgba(0,0,0,0.9));">${foreCrags}</g>`;

          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Fields (Nested Conic Contour Terraces & Perspective Furrow Cadence)
         * - Layer 0 [Sky/Sun]: Radiant dawn sun glow
         * - Layer 1 [Distant Plane]: Far misty rolling hills (blur)
         * - Layers 2..5 [Contour Terraces]: Nested sweeping parabolic shelves with shared boundary edges
         * - Furrows: Equidistant agricultural furrow lines flowing along contours
         * ------------------------------------------------------------------------- */
        Fields: (rng, p) => {
          let svg = `<defs><linearGradient id="fldSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="100%" stop-color="${p[2]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#fldSky-${rng.seed})" />`;
          svg += `<circle cx="600" cy="130" r="95" fill="${p[4]}" opacity="0.35" style="filter: blur(25px);" />`;

          // 5 Nested Parabolic Contour Terraces (Shared Continuous Boundary Ribs)
          for (let l = 0; l < 5; l++) {
            const y = 160 + l * 62;
            let terrace = `<g stroke-linejoin="round">`;

            // Shelf Parabolic Path
            let shelfPts = `-50,450 `;
            for (let x = -50; x <= 850; x += 50) {
              const py = y + Math.sin((x + l * 90) * 0.007) * 28;
              shelfPts += `${x},${py.toFixed(1)} `;
            }
            shelfPts += `850,450`;

            // Riser Shadow Band
            let riserPts = `-50,${y + 12} `;
            for (let x = -50; x <= 850; x += 50) {
              const py = y + Math.sin((x + l * 90) * 0.007) * 28;
              riserPts += `${x},${py.toFixed(1)} `;
            }
            riserPts += `850,${y + 12}`;

            terrace += `<polygon points="${shelfPts}" fill="${p[Math.min(4, Math.max(0, 4 - l))]}" />`;
            terrace += `<path d="M ${riserPts}" fill="none" stroke="${p[1]}" stroke-width="6" />`;

            // Equidistant Perspective Furrow Stripes along Contour
            for (let f = 0; f < 6; f++) {
              const fx = 60 + f * 120 + (l % 2) * 30;
              const fy = y + Math.sin((fx + l * 90) * 0.007) * 28;
              terrace += `<line x1="${fx}" y1="${fy}" x2="${fx + 40}" y2="${fy + 35}" stroke="${p[0]}" stroke-width="1.8" stroke-dasharray="6 8" />`;
            }
            terrace += `</g>`;

            const filter =
              l === 0
                ? `style="filter: blur(2.5px);"`
                : `style="filter: drop-shadow(0 -6px 14px rgba(0,0,0,0.55));"`;
            svg += `<g ${filter}>${terrace}</g>`;
          }
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Vale (Alpine Valley with Snow-Capped Massif, Lake & Pine Slopes)
         * - Layer 0 [Sky/Clouds]: High-altitude atmosphere with faceted cloud strips
         * - Layer 1 [Distant Massif]: 5 snow-capped low-poly peaks (blur & washout)
         * - Layer 1.5 [Valley Lake]: Reflective glacial lake
         * - Layer 2 & 3 [Midground Slopes]: Faceted left/right ridges with lit/shadow faces
         * - Layer 4 & 5 [Foreground]: Darkest framing silhouettes & slope-anchored pines
         * ------------------------------------------------------------------------- */
        Vale: (rng, p) => {
          let svg = `<defs>
            <linearGradient id="vSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${p[4]}" stop-opacity="0.8"/>
              <stop offset="50%" stop-color="${p[3]}"/>
              <stop offset="100%" stop-color="${p[1]}"/>
            </linearGradient>
          </defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#vSky-${rng.seed})" />`;

          // Ambient Background Clouds
          svg += `<g style="filter: blur(4px); opacity: 0.4;">`;
          for (let i = 0; i < 3; i++) {
            const cy = rng.range(15, 75),
              cx = rng.range(80, 720),
              cw = rng.range(160, 320);
            svg += `<polygon points="${cx - cw / 2},${cy} ${cx + cw / 2},${cy} ${cx + cw / 2 - 25},${cy + 14} ${cx - cw / 2 + 25},${cy + 14}" fill="#ffffff" />`;
          }
          svg += `</g>`;

          // LAYER 1: Distant Snow-Capped Faceted Peaks
          const distPeaks = [
            { x: 450, y: rng.range(50, 90), w: rng.range(400, 500) },
            { x: 280, y: rng.range(80, 120), w: rng.range(300, 400) },
            { x: 650, y: rng.range(90, 130), w: rng.range(300, 400) },
            { x: 100, y: rng.range(120, 160), w: rng.range(250, 350) },
            { x: 850, y: rng.range(120, 160), w: rng.range(250, 350) },
          ];

          let distMarkup = "";
          for (const peak of distPeaks) {
            const px = peak.x + rng.range(-15, 15),
              py = peak.y,
              pw = peak.w,
              botY = 450;
            const ridgeBotX = px + rng.range(-pw * 0.1, pw * 0.1);
            distMarkup += `<polygon points="${px - pw / 2},${botY} ${px},${py} ${ridgeBotX},${botY}" fill="${p[2]}" />`;
            distMarkup += `<polygon points="${ridgeBotX},${botY} ${px},${py} ${px + pw / 2},${botY}" fill="${p[3]}" />`;
            const snowH = rng.range(40, 60),
              snowRatio = snowH / (botY - py);
            const slX = px - (pw / 2) * snowRatio,
              srX = px + (pw / 2) * snowRatio,
              smX = px + (ridgeBotX - px) * snowRatio;
            const sBotY = py + snowH,
              jaggedY = sBotY + rng.range(-10, 10);
            distMarkup += `<polygon points="${slX},${sBotY} ${px},${py} ${smX},${jaggedY}" fill="#f0f0f5" />`;
            distMarkup += `<polygon points="${smX},${jaggedY} ${px},${py} ${srX},${sBotY}" fill="#ffffff" />`;
          }
          svg += `<g style="filter: blur(3px); opacity: 0.75;">${distMarkup}</g>`;

          // LAYER 1.5: Water Layer (Glacial Lake)
          const waterY = rng.range(250, 270);
          svg += `<g style="filter: drop-shadow(0px -3px 6px rgba(0,0,0,0.3)); opacity: 0.9;">`;
          svg += `<rect x="0" y="${waterY}" width="800" height="${450 - waterY}" fill="${p[4]}" />`;
          for (let i = 0; i < 6; i++) {
            svg += `<rect x="${rng.range(0, 700)}" y="${waterY + rng.range(5, 60)}" width="${rng.range(40, 150)}" height="2" fill="${p[3]}" />`;
          }
          svg += `</g>`;

          // LAYER 2 & 3: Midground Mountains
          const mlX = rng.range(150, 250),
            mlY = rng.range(160, 200),
            mlW = rng.range(500, 600),
            mlRidge = mlX + rng.range(-30, 30);
          let midLeft = `<polygon points="${mlX - mlW / 2},450 ${mlX},${mlY} ${mlRidge},450" fill="${p[1]}" />`;
          midLeft += `<polygon points="${mlRidge},450 ${mlX},${mlY} ${mlX + mlW / 2},450" fill="${p[2]}" />`;

          const mrX = rng.range(550, 650),
            mrY = rng.range(120, 160),
            mrW = rng.range(600, 700),
            mrRidge = mrX + rng.range(-40, 40);
          let midRight = `<polygon points="${mrX - mrW / 2},450 ${mrX},${mrY} ${mrRidge},450" fill="${p[1]}" />`;
          midRight += `<polygon points="${mrRidge},450 ${mrX},${mrY} ${mrX + mrW / 2},450" fill="${p[2]}" />`;
          svg += `<g style="filter: blur(1px) drop-shadow(0px -5px 10px rgba(0,0,0,0.45)); opacity: 0.95;">${midLeft}${midRight}</g>`;

          // LAYER 4: Foreground Mountains
          const flX = rng.range(80, 150),
            flY = rng.range(280, 320),
            flW = rng.range(500, 700),
            flRidge = flX + rng.range(-20, 20);
          let foreLeft = `<polygon points="${flX - flW / 2},450 ${flX},${flY} ${flRidge},450" fill="${p[0]}" />`;
          foreLeft += `<polygon points="${flRidge},450 ${flX},${flY} ${flX + flW / 2},450" fill="${p[1]}" />`;

          const frX = rng.range(650, 750),
            frY = rng.range(250, 300),
            frW = rng.range(600, 800),
            frRidge = frX + rng.range(-20, 20);
          let foreRight = `<polygon points="${frX - frW / 2},450 ${frX},${frY} ${frRidge},450" fill="${p[0]}" />`;
          foreRight += `<polygon points="${frRidge},450 ${frX},${frY} ${frX + frW / 2},450" fill="${p[1]}" />`;
          svg += `<g style="filter: drop-shadow(0px -10px 18px rgba(0,0,0,0.7));">${foreLeft}${foreRight}</g>`;

          // LAYER 5: Pine Trees
          function drawTrees(startX, startY, endX, endY, count, color) {
            let tr = "";
            for (let i = 0; i < count; i++) {
              const t = i / count + rng.range(-2, 2) * 0.01;
              const tx = startX + (endX - startX) * t,
                ty = startY + (endY - startY) * t + rng.range(-2, 2);
              const th = rng.range(15, 30),
                tw = th * 0.45;
              tr += `<polygon points="${tx},${ty - th} ${tx - tw},${ty} ${tx + tw},${ty}" fill="${color}" />`;
              tr += `<polygon points="${tx},${ty - th * 0.7} ${tx - tw * 0.8},${ty - th * 0.1} ${tx + tw * 0.8},${ty - th * 0.1}" fill="${color}" />`;
            }
            return tr;
          }
          let trees =
            drawTrees(flX - flW / 2, 450, flX, flY, 20, p[0]) +
            drawTrees(frX, frY, frX + frW / 2, 450, 20, p[0]);
          svg += `<g style="filter: drop-shadow(0px -4px 8px rgba(0,0,0,0.85));">${trees}</g>`;

          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Canyon (Stepped Low-Poly Terraced Gorge)
         * - Layers 0..5 [Gorge Walls]: Stepped low-poly rock blocks descending in depth
         * ------------------------------------------------------------------------- */
        Canyon: (rng, p) => {
          let svg = `<defs><linearGradient id="canyonSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="60%" stop-color="${p[2]}"/><stop offset="100%" stop-color="${p[0]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#canyonSky-${rng.seed})" />`;
          const layers = 5;
          for (let l = 0; l < layers; l++) {
            const depth = l / (layers - 1),
              sy = 130 + l * 55;
            let cx = -50,
              blocks = "";
            while (cx < 850) {
              const w = rng.range(100, 200),
                y = sy + rng.range(-25, 25);
              blocks += `<polygon points="${cx},${y} ${cx + w},${y} ${cx + w},450 ${cx},450" fill="${p[Math.min(3, Math.max(0, 3 - l))]}" />`;
              blocks += `<polygon points="${cx},${y} ${cx + w},${y} ${cx + w - 20},${y - 15} ${cx + 20},${y - 15}" fill="${p[Math.min(4, Math.max(1, 4 - l))]}" />`;
              cx += w;
            }
            const blurAmt = Math.max(0, (1 - depth) * 5.5);
            const filterStyle =
              blurAmt > 0.6
                ? `style="filter: blur(${blurAmt.toFixed(1)}px); opacity: ${(0.6 + depth * 0.4).toFixed(2)};"`
                : `style="filter: drop-shadow(0px -${(l + 1) * 3.5}px ${(l + 1) * 4}px rgba(0,0,0,0.7));"`;
            svg += `<g ${filterStyle}>${blocks}</g>`;
          }
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Dunes (Desert Barchan Dunes with Nested Conical Parabolas & Shared Spines)
         * - Layer 0 [Sky]: Heat-haze horizon gradient
         * - Layer 1 [Distant Dunes]: Soft background parabolic sand ridges (blur 3px)
         * - Layer 2 [Midground Dunes]: Nested parabolic sweeping slip-faces sharing crest spines
         * - Layer 3 [Foreground Dunes]: High-contrast sweeping barchan dune sheets
         * ------------------------------------------------------------------------- */
        Dunes: (rng, p) => {
          let svg = `<defs><linearGradient id="duneSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="70%" stop-color="${p[3]}"/><stop offset="100%" stop-color="${p[1]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#duneSky-${rng.seed})" />`;

          svg += `<circle cx="450" cy="120" r="100" fill="${p[4]}" opacity="0.3" style="filter: blur(25px);" />`;

          // Nested Conical/Parabolic Dune Ridge Generator (Shared Spine Vertices)
          function generateNestedParabolaDune(
            startX,
            startY,
            peakX,
            peakY,
            endX,
            endY,
            botY,
            colLit,
            colShadow,
          ) {
            let dune = `<g stroke-linejoin="round">`;
            // Outer Parabolic Windward Sweep (Lit Face)
            dune += `<path d="M ${startX},${botY} L ${startX},${startY} Q ${peakX},${peakY - 25} ${peakX},${peakY} Q ${peakX},${peakY + 15} ${endX},${endY} L ${endX},${botY} Z" fill="${colLit}" />`;
            // Nested Inner Parabolic Slip-Face (Shadow Face sharing the peak vertex)
            dune += `<path d="M ${startX},${startY} Q ${peakX},${peakY} ${peakX + (endX - startX) * 0.15},${peakY + 40} L ${startX + (endX - startX) * 0.3},${botY} L ${startX},${botY} Z" fill="${colShadow}" />`;
            // Nested Tertiary Parabolic Ripple Crest
            dune += `<path d="M ${peakX - 60},${botY} Q ${peakX - 30},${peakY + 20} ${peakX + 40},${botY} Z" fill="${colShadow}" opacity="0.7" />`;
            dune += `</g>`;
            return dune;
          }

          // Layer 1: Distant Soft Parabolic Dunes
          let distDunes = "";
          distDunes += generateNestedParabolaDune(
            -50,
            190,
            220,
            130,
            520,
            210,
            450,
            p[3],
            p[2],
          );
          distDunes += generateNestedParabolaDune(
            300,
            210,
            600,
            150,
            850,
            230,
            450,
            p[3],
            p[2],
          );
          svg += `<g style="filter: blur(3px); opacity: 0.7;">${distDunes}</g>`;

          // Layer 2: Midground Nested Parabolic Ridges
          let midDunes = "";
          midDunes += generateNestedParabolaDune(
            -50,
            270,
            360,
            180,
            850,
            290,
            450,
            p[3],
            p[1],
          );
          svg += `<g style="filter: drop-shadow(0 -6px 12px rgba(0,0,0,0.45));">${midDunes}</g>`;

          // Layer 3: Foreground High-Contrast Barchan Dune Sheet
          let foreDunes = "";
          foreDunes += generateNestedParabolaDune(
            -50,
            360,
            440,
            240,
            850,
            350,
            450,
            p[4],
            p[0],
          );
          foreDunes += `<polygon points="0,450 0,390 280,310 800,400 800,450" fill="${p[1]}" />`;
          foreDunes += `<polygon points="0,390 280,310 180,450 0,450" fill="${p[0]}" />`;
          svg += `<g style="filter: drop-shadow(0 -10px 18px rgba(0,0,0,0.8));">${foreDunes}</g>`;

          return svg;
        },

        // =========================================================================
        // MAZE ARTIFACTS (Architectural Depths, Crypts & Abyssal Chasms)
        // =========================================================================

        /* -------------------------------------------------------------------------
         * NOUN: Catacombs (Deep Vaulted Stone Crypt Arches)
         * - Layer 0 [Void]: Deep subterranean corridor
         * - Layers 1..5 [Concentric Vaults]: Receding archway vaults with drop-shadows
         * ------------------------------------------------------------------------- */
        Catacombs: (rng, p) => {
          let svg = `<rect width="100%" height="100%" fill="${p[0]}" />`;
          for (let i = 4; i >= 0; i--) {
            const pad = i * 45,
              col = p[i];
            svg += `<path d="M ${pad},450 L ${pad},${150 + i * 20} Q 400,${i * 20} ${800 - pad},${150 + i * 20} L ${800 - pad},450 Z" fill="none" stroke="${col}" stroke-width="18" style="filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));" />`;
          }
          svg += `<circle cx="400" cy="240" r="12" fill="${p[4]}" style="filter: blur(2px);" />`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Labyrinth (Isometric Penrose Impossible Stairway Loop)
         * - Layer 0 [Atmosphere]: Central mystical depth halo
         * - Layers 1..4 [Stair Flights]: 4 orthogonal isometric flights with front/back occlusion
         * ------------------------------------------------------------------------- */
        Labyrinth: (rng, p) => {
          let svg = `<rect width="100%" height="100%" fill="${p[0]}" />`;
          svg += `<circle cx="400" cy="200" r="180" fill="${p[2]}" opacity="0.25" style="filter: blur(25px);" />`;
          const N = 8,
            corners = [
              { x: 400, y: 40 },
              { x: 660, y: 185 },
              { x: 400, y: 330 },
              { x: 140, y: 185 },
            ];
          const configs = [
            {
              d: { x: 32.5, y: 18.125 },
              w: { x: -22, y: 12 },
              h: 12,
              s: p[3],
              r: p[1],
            },
            {
              d: { x: -32.5, y: 18.125 },
              w: { x: 22, y: 12 },
              h: 12,
              s: p[2],
              r: p[1],
            },
            {
              d: { x: -32.5, y: -18.125 },
              w: { x: 22, y: -12 },
              h: 12,
              s: p[3],
              r: p[2],
            },
            {
              d: { x: 32.5, y: -18.125 },
              w: { x: -22, y: -12 },
              h: 12,
              s: p[2],
              r: p[1],
            },
          ];
          let flights = [];
          for (let f = 0; f < 4; f++) {
            let mk = `<g stroke-linejoin="round" stroke-linecap="round">`;
            const st = corners[f],
              cfg = configs[f];
            for (let s = 0; s < N; s++) {
              const x0 = st.x + s * cfg.d.x,
                y0 = st.y + s * cfg.d.y;
              const x1 = st.x + (s + 1) * cfg.d.x,
                y1 = st.y + (s + 1) * cfg.d.y;
              const tread = `${x0},${y0} ${x1},${y1} ${x1 + cfg.w.x},${y1 + cfg.w.y} ${x0 + cfg.w.x},${y0 + cfg.w.y}`;
              const riser = `${x0},${y0} ${x0 + cfg.w.x},${y0 + cfg.w.y} ${x0 + cfg.w.x},${y0 + cfg.w.y + cfg.h} ${x0},${y0 + cfg.h}`;
              mk += `<polygon points="${riser}" fill="${cfg.r}" stroke="${p[0]}" stroke-width="1.2" />`;
              mk += `<polygon points="${tread}" fill="${cfg.s}" stroke="${p[0]}" stroke-width="1.2" />`;
            }
            mk += `</g>`;
            flights.push(mk);
          }
          svg += `<g style="filter: blur(1.5px); opacity: 0.8;">${flights[0]}</g>`;
          svg += `<g style="filter: drop-shadow(-6px 8px 12px rgba(0,0,0,0.6));">${flights[3]}</g>`;
          svg += `<g style="filter: drop-shadow(6px 8px 12px rgba(0,0,0,0.6));">${flights[1]}</g>`;
          svg += `<g style="filter: drop-shadow(0px 14px 20px rgba(0,0,0,0.85));">${flights[2]}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Spire (Basalt Column Cluster / Monolithic Jointed Pillars)
         * - Layer 0 [Sky]: Atmospheric gradient
         * - Layer 1 [Distant Plane]: Cloud strata & background spires (blur)
         * - Layer 2 [Basalt Cluster]: Hexagonal jointed pillars with bevelled lit/shadow caps
         * ------------------------------------------------------------------------- */
        Spire: (rng, p) => {
          let svg = `<defs><linearGradient id="spireSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[1]}"/><stop offset="100%" stop-color="${p[4]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#spireSky-${rng.seed})" />`;
          svg += `<g style="filter: blur(4px); opacity: 0.5;">`;
          svg += `<polygon points="0,300 800,280 800,340 0,360" fill="${p[3]}" />`;
          svg += `<polygon points="200,450 220,100 240,450" fill="${p[2]}" />`;
          svg += `<polygon points="560,450 580,80 600,450" fill="${p[2]}" />`;
          svg += `</g>`;

          let cluster = `<g stroke-linejoin="round">`;
          function drawColumn(xL, xMid, xR, topY, capHeight) {
            let col = "";
            col += `<polygon points="${xL},${topY + capHeight} ${xMid},${topY} ${(xL + xMid) / 2},${topY + capHeight * 0.4}" fill="${p[4]}" />`;
            col += `<polygon points="${xMid},${topY} ${xR},${topY + capHeight} ${(xMid + xR) / 2},${topY + capHeight * 0.4}" fill="${p[3]}" />`;
            col += `<polygon points="${xL},${topY + capHeight} ${xMid},${topY + capHeight * 1.5} ${xMid},450 ${xL},450" fill="${p[2]}" />`;
            col += `<polygon points="${xMid},${topY + capHeight * 1.5} ${xR},${topY + capHeight} ${xR},450 ${xMid},450" fill="${p[0]}" />`;
            return col;
          }

          cluster += drawColumn(250, 290, 330, 180, 20);
          cluster += drawColumn(470, 510, 550, 180, 20);
          cluster += drawColumn(310, 355, 400, 100, 25);
          cluster += drawColumn(400, 445, 490, 100, 25);
          cluster += drawColumn(350, 400, 450, 20, 35);

          cluster += `</g>`;
          svg += `<g style="filter: drop-shadow(0 0 25px rgba(0,0,0,0.9));">${cluster}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Ruins (Classical Marble Colonnade with Broken Pediment)
         * - Layer 0 [Sky]: Ruin sunset gradient
         * - Layer 1 [Distant Plane]: Ruined distant archway (blur)
         * - Layer 2 [Foreground Plane]: Standing classical pillars & fallen stone headers
         * ------------------------------------------------------------------------- */
        Ruins: (rng, p) => {
          let svg = `<defs><linearGradient id="ruinSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="100%" stop-color="${p[1]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#ruinSky-${rng.seed})" />`;
          svg += `<g style="filter: blur(3px); opacity: 0.6;">`;
          svg += `<rect x="250" y="160" width="300" height="20" fill="${p[2]}" />`;
          svg += `<rect x="280" y="180" width="25" height="150" fill="${p[2]}" />`;
          svg += `<rect x="495" y="180" width="25" height="150" fill="${p[2]}" />`;
          svg += `</g>`;
          let cols = `<polygon points="0,450 0,330 800,330 800,450" fill="${p[0]}" />`;
          for (let i = 0; i < 5; i++) {
            const cx = 100 + i * 140,
              h = 180 + (i % 3) * 35;
            cols += `<rect x="${cx}" y="${330 - h}" width="36" height="${h}" fill="${p[1]}" />`;
            cols += `<polygon points="${cx - 8},${330 - h} ${cx + 18},${310 - h} ${cx + 44},${330 - h}" fill="${p[2]}" />`;
          }
          svg += `<g style="filter: drop-shadow(0 -10px 18px rgba(0,0,0,0.85));">${cols}</g>`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Abyss (Sheer Tectonic Chasm into Radiant Planetary Core)
         * - Layer 0 [Deep Core]: Radiant volcanic/mystic chasm light (blur 20px)
         * - Layer 1 [Left/Right Cliffs]: Sheer cliff canyon walls framing the abyss
         * ------------------------------------------------------------------------- */
        Abyss: (rng, p) => {
          let svg = `<rect width="100%" height="100%" fill="${p[0]}" />`;
          svg += `<rect x="350" y="0" width="100" height="450" fill="${p[4]}" opacity="0.4" style="filter: blur(20px);" />`;
          svg += `<polygon points="0,0 360,0 280,450 0,450" fill="${p[1]}" style="filter: drop-shadow(10px 0 15px rgba(0,0,0,0.9));" />`;
          svg += `<polygon points="800,0 440,0 520,450 800,450" fill="${p[2]}" style="filter: drop-shadow(-10px 0 15px rgba(0,0,0,0.9));" />`;
          return svg;
        },

        /* -------------------------------------------------------------------------
         * NOUN: Woods (Atmospheric Multi-Plane Silhouette Pine Forest)
         * - Layer 0 [Sun/Sky]: Wobble-filtered misty sun & horizon gradient
         * - Layers 1..6 [Tree Planes]: Receding forest silhouette planes with distance fog
         * ------------------------------------------------------------------------- */
        Woods: (rng, p) => {
          let svg = `<defs><linearGradient id="woodsSky-${rng.seed}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${p[4]}"/><stop offset="50%" stop-color="${p[3]}"/><stop offset="100%" stop-color="${p[1]}"/></linearGradient></defs>`;
          svg += `<rect width="100%" height="100%" fill="url(#woodsSky-${rng.seed})" />`;
          const sunX = rng.range(150, 650),
            sunY = rng.range(100, 220);
          svg += `<circle cx="${sunX}" cy="${sunY}" r="${rng.range(60, 120)}" fill="${p[4]}" opacity="0.6" filter="url(#filter-wobble)" />`;
          const layers = 6;
          for (let l = 0; l < layers; l++) {
            const depth = l / (layers - 1),
              yMin = 180 - l * 20,
              spCount = rng.range(3, 6);
            const col =
              l === layers - 1 ? p[0] : l > 3 ? p[1] : l > 1 ? p[2] : p[3];
            const blurAmt = Math.max(0, (1 - depth) * 6);
            const filterStyle =
              blurAmt > 0.5
                ? `style="filter: blur(${blurAmt.toFixed(1)}px); opacity: ${(0.6 + depth * 0.4).toFixed(2)};"`
                : `style="filter: drop-shadow(0px -${(l + 1) * 3}px ${(l + 1) * 3}px rgba(0,0,0,0.6));"`;
            svg += `<g stroke="none" fill="${col}" ${filterStyle}>`;
            for (let i = 0; i < spCount; i++) {
              const cx = rng.range(50, 750),
                sy = rng.range(yMin, yMin + 80),
                w = rng.range(60 + l * 20, 140 + l * 30);
              svg += `<polygon points="${cx - w / 2},420 ${cx},${sy} ${cx + w / 2},420" />`;
            }
            svg += `</g>`;
          }
          return svg;
        },
      };

      /** =========================================================================
       *  MASTER DOM ASSEMBLER & CONTROLLER
       *  ========================================================================= */
      function buildCard(adjective, noun, category, engine) {
        const fullName = `The ${adjective} ${noun}`;
        const rng = new SeededRNG(fullName);
        const palette = PALETTES[adjective] || PALETTES.Fractured;

        const card = document.createElement("div");
        card.className = "art-card";

        const headerDiv = document.createElement("div");
        headerDiv.className = "art-header";

        const title = document.createElement("h3");
        title.className = "art-title";
        title.innerText = fullName;

        const badge = document.createElement("span");
        badge.className = "art-badge";
        badge.innerText = category;

        headerDiv.appendChild(title);
        headerDiv.appendChild(badge);

        const container = document.createElement("div");
        container.className = `art-container style-${engine}`;

        if (adjective === "Eldritch" && engine !== "pixel")
          container.classList.add("anim-eldritch");
        if (adjective === "Neon" && engine !== "pixel")
          container.classList.add("anim-neon");

        if (engine === "pixel") {
          const renderer = new PixelRenderer(160, 90);
          renderer.setPalette(palette);
          if (GenPixel[noun]) GenPixel[noun](renderer, rng);
          if (adjective === "Fractured" || adjective === "Shattered")
            renderer.applyGlitch(rng);
          container.appendChild(renderer.present());
        } else {
          let filterAttr = "";
          if (adjective === "Fractured" || adjective === "Shattered")
            filterAttr = `filter="url(#filter-glitch)"`;
          if (adjective === "Overgrown")
            filterAttr = `filter="url(#filter-wobble)"`;
          const bgSVG = GenVectorBG[noun]
            ? GenVectorBG[noun](rng, palette)
            : GenVectorBG.Vale(rng, palette);
          container.innerHTML = `<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"><g class="midground" ${filterAttr}>${bgSVG}</g></svg>`;
        }

        card.appendChild(headerDiv);
        card.appendChild(container);
        return card;
      }

      const gallery = document.getElementById("gallery");
      const engineSelect = document.getElementById("engine-select");
      const categorySelect = document.getElementById("category-select");
      const adjectiveSelect = document.getElementById("adjective-select");

      Object.keys(PALETTES).forEach((adj) => {
        const opt = document.createElement("option");
        opt.value = adj;
        opt.innerText = adj;
        adjectiveSelect.appendChild(opt);
      });

      function renderGallery() {
        gallery.innerHTML = "";
        const selectedEngine = engineSelect.value;
        const selectedCategory = categorySelect.value;
        const selectedAdjective = adjectiveSelect.value;

        const adjectives =
          selectedAdjective === "all"
            ? Object.keys(PALETTES)
            : [selectedAdjective];
        const categories =
          selectedCategory === "all"
            ? Object.keys(NOUN_DATA)
            : [selectedCategory];

        adjectives.forEach((adj) => {
          categories.forEach((cat) => {
            NOUN_DATA[cat].forEach((noun) => {
              gallery.appendChild(buildCard(adj, noun, cat, selectedEngine));
            });
          });
        });
      }

      engineSelect.addEventListener("change", renderGallery);
      categorySelect.addEventListener("change", renderGallery);
      adjectiveSelect.addEventListener("change", renderGallery);

      renderGallery();
    </script>
  </body>
</html>
